async function processarPlanilhas() {
  const btn = document.getElementById('btn-processar')
  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span> Processando...'
  document.getElementById('proc-status').className = 'alert alert-info'
  document.getElementById('proc-status').textContent = '⏳ Processando planilhas...'
  document.getElementById('card-resultado').style.display = 'none'

  try {
    setProgresso(10, 'Lendo planilhas...')
    // Lê apenas os arquivos que foram enviados (nem todos são obrigatórios)
    const enviados = TIPOS_ARQUIVO.filter(t => arquivos[t.id])
    guardarArquivos(enviados.map(t => arquivos[t.id]), 'Processamento do dia')
    const lidos = await Promise.all(enviados.map(t => lerPlanilha(arquivos[t.id])))

    setProgresso(25, 'Buscando referência no Supabase...')
    const refs = await sb('fgf_referencia?select=dados&order=criado_em.desc&limit=1')
    const referencia = (refs && refs[0] && refs[0].dados) ? refs[0].dados : []

    setProgresso(40, 'Processando dados...')
    // Junta os 4 arquivos. Nos de finalizados (Concedido/Recusado) aplica
    // automaticamente o corte: só entram as cadastradas desde 01/01/2025.
    let todas = []
    let cortadas = 0
    enviados.forEach((t, i) => {
      let linhas = transformar(lidos[i])
      // Todas as planilhas: só propostas cadastradas desde 2025
      const antes = linhas.length
      linhas = filtrarUltimosMeses(linhas)
      cortadas += antes - linhas.length
      todas = todas.concat(linhas)
    })
    const merged = deduplicar(todas)

    // Buscar atribuições manuais já salvas no banco para preservá-las
    const propostasExistentes = await sbAll('fgf_propostas?select=codigo,etapa,nome,responsavel,responsavel_final,estagiario,observacao,observacoes_anteriores,data_cadastro')
    // Data de cadastro já salva: não se perde se a planilha do dia vier sem a coluna
    const mapaCadastro = {}
    ;(propostasExistentes || []).forEach(p => { if (p.data_cadastro) mapaCadastro[String(p.codigo).trim()] = p.data_cadastro })
    // TODAS as propostas já existentes entram no mapa — inclusive as que estão
    // sem analista, porque podem ter estagiário. E o estagiário PRECISA vir junto,
    // senão o processamento apaga a atribuição.
    const mapaAtribuicoes = {}
    if (propostasExistentes) {
      propostasExistentes.forEach(p => {
        mapaAtribuicoes[String(p.codigo).trim()] = {
          responsavel: p.responsavel,
          responsavel_final: p.responsavel_final,
          estagiario: p.estagiario,
          nome: p.nome || '',
          // observacao E observacoes_anteriores precisam vir juntas: se faltar uma
          // delas aqui, o upsert grava vazio por cima. Foi assim que os vinculos
          // de estagiario sumiram uma vez — a regra vale para todo campo comparado.
          observacao: p.observacao || '',
          observacoes_anteriores: p.observacoes_anteriores || ''
        }
      })
    }

    const comVlookup = aplicarVlookup(merged, referencia, mapaAtribuicoes)

    const propostas = comVlookup.map(r => ({
      responsavel: r.responsavel || 'N/A',
      estagiario: r.estagiario || 'N/A',
      codigo: r.codigo,
      nome: r.nome || '',
      etapa: r.etapa,
      valor: parseValor(r.valor),
      linha_credito: r.linhaCredito || '',
      municipio: r.municipio || '',
      na_etapa_desde: (() => {
        try { return r.naEtapaDe && !isNaN(r.naEtapaDe.getTime()) ? r.naEtapaDe.toISOString().split('T')[0] : null }
        catch(e) { return null }
      })(),
      data_cadastro: (() => {
        try { return r.dataCadastro && !isNaN(r.dataCadastro.getTime()) ? r.dataCadastro.toISOString().split('T')[0] : (mapaCadastro[String(r.codigo).trim()] || null) }
        catch(e) { return mapaCadastro[String(r.codigo).trim()] || null }
      })(),
      observacoes_anteriores: r.observacoesAnteriores || '',
      observacao: r.observacao || '',
      responsavel_final: r.responsavelFinal || 'N/A',
    }))

    // Gravacao em lotes. Antes era um POST por proposta: com 400 propostas eram
    // 400 idas ao servidor, e se a rede caisse no meio o processamento ficava
    // pela metade sem nem registrar o historico.
    setProgresso(55, `Salvando ${propostas.length} propostas...`)
    const TAMANHO_LOTE = 200
    let salvas = 0
    for (let i = 0; i < propostas.length; i += TAMANHO_LOTE) {
      const lote = propostas.slice(i, i + TAMANHO_LOTE)
      await sb('fgf_propostas?on_conflict=codigo', {
        method: 'POST',
        prefer: 'resolution=merge-duplicates,return=minimal',
        body: lote
      })
      salvas += lote.length
      setProgresso(55 + Math.round((salvas/propostas.length)*30), `Salvando... ${salvas}/${propostas.length}`)
    }

    setProgresso(88, 'Salvando histórico...')
    await sb('fgf_historico', {
      method: 'POST',
      prefer: 'return=minimal',
      body: {
        arquivos_enviados: enviados.map(t => arquivos[t.id].name),
        turno: turnoAtual,
        total_propostas: propostas.length
      }
    })

    setProgresso(94, 'Salvando referência para amanhã...')
    const novaRef = propostas.map(p => ({
      codigo: p.codigo,
      observacao: p.observacao,
      responsavel_final: p.responsavel_final,
      estagiario: p.estagiario
    }))
    await sb('fgf_referencia', {
      method: 'POST',
      prefer: 'return=minimal',
      body: { dados: novaRef }
    })

    setProgresso(100, 'Concluído!')
    document.getElementById('proc-status').className = 'alert alert-success'
    document.getElementById('proc-status').textContent = `✅ Processamento concluído! ${propostas.length} propostas salvas.`

    const semAnalista = propostas.filter(p => p.responsavel === 'N/A').length
    const semEstagiario = propostas.filter(p => p.estagiario === 'N/A').length
    const comAnalista = propostas.filter(p => p.responsavel !== 'N/A').length
    const ativasQtd = propostas.filter(p => ehAtiva(p.etapa)).length
    const finalizadasQtd = propostas.length - ativasQtd
    document.getElementById('card-resultado').style.display = ''
    document.getElementById('resultado-content').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">${propostas.length}</div><div class="stat-sub">propostas</div></div>
        <div class="stat-card"><div class="stat-label">Em Andamento</div><div class="stat-value">${ativasQtd}</div></div>
        <div class="stat-card"><div class="stat-label">Finalizadas</div><div class="stat-value">${finalizadasQtd}</div></div>
        <div class="stat-card"><div class="stat-label">Com Analista</div><div class="stat-value" style="color:#166534">${comAnalista}</div></div>
        <div class="stat-card"><div class="stat-label">Sem Analista</div><div class="stat-value" style="color:${semAnalista>0?'#92400e':'#166534'}">${semAnalista}</div></div>
        <div class="stat-card"><div class="stat-label">Sem Estagiário</div><div class="stat-value" style="color:${semEstagiario>0?'#92400e':'#166534'}">${semEstagiario}</div></div>
        ${cortadas > 0 ? `<div class="stat-card"><div class="stat-label">Fora da janela</div><div class="stat-value" style="color:#64748b">${cortadas}</div><div class="stat-sub">descartadas</div></div>` : ''}
      </div>
      <button class="btn btn-primary" onclick="setTab('propostas');carregarPropostas()">Ver Propostas →</button>`

    showToast(`${propostas.length} propostas processadas com sucesso!`)

  } catch(err) {
    console.error(err)
    document.getElementById('proc-status').className = 'alert alert-danger'
    document.getElementById('proc-status').textContent = '❌ Erro: ' + err.message
    showToast('Erro no processamento: ' + err.message, 'error')
  } finally {
    btn.disabled = false
    btn.innerHTML = '⚡ Processar Planilhas'
  }
}

async function carregarPropostas() {
  try {
    const data = await sbAll('fgf_propostas?select=*&order=codigo.asc')

    todasPropostas = normalizarPropostas(filtrarPorJanela(data || []))
    popularSelectEtapas()
    renderTabelaPropostas()
    renderStatsPropostas()
    atualizarBadgeFiltros()
  } catch(e) {
    document.getElementById('tabela-propostas').innerHTML = `<div class="alert alert-danger">❌ Erro ao carregar: ${e.message}</div>`
  }
}

// Preenche o estagiário das propostas que estão sem, usando a lista oficial,
// e grava no banco para que a correção seja permanente.
// Aplica os filtros avançados (período e faixa de valor)
function aplicarFiltrosData(rows) {
  if (filtroDataIni) {
    rows = rows.filter(p => {
      if (!p.na_etapa_desde) return false
      return String(p.na_etapa_desde).split('T')[0] >= filtroDataIni
    })
  }
  if (filtroDataFim) {
    rows = rows.filter(p => {
      if (!p.na_etapa_desde) return false
      return String(p.na_etapa_desde).split('T')[0] <= filtroDataFim
    })
  }
  if (filtroValorMin !== '' && !isNaN(Number(filtroValorMin))) {
    rows = rows.filter(p => valorNum(p) >= Number(filtroValorMin))
  }
  if (filtroValorMax !== '' && !isNaN(Number(filtroValorMax))) {
    rows = rows.filter(p => valorNum(p) <= Number(filtroValorMax))
  }
  if (filtroEtapa) {
    rows = rows.filter(p => (p.etapa||'').trim() === filtroEtapa)
  }
  if (filtroLinhaCredito) {
    rows = rows.filter(p => normalizarLinhaCredito(p.linha_credito) === filtroLinhaCredito)
  }
  return rows
}

// Retorna as linhas conforme o filtro de colaborador ativo + filtros avançados (sem busca textual)
function getLinhasFiltradas() {
  let rows = [...todasPropostas]
  if (filtroColab === 'NOVAS') {
    // Novas = ativas que ainda não têm analista OU não têm estagiário
    rows = rows.filter(p => {
      const a = (p.responsavel||'N/A').toUpperCase().trim()
      const e = (p.estagiario||'N/A').toUpperCase().trim()
      return (a === 'N/A' || e === 'N/A') && ehAtiva(p.etapa)
    })
  } else if (filtroColab === 'TODOS') {
    // Exige responsável apenas das ATIVAS. Finalizadas (concedido/recusado/excluído)
    // são histórico e não precisam de responsável para aparecer.
    rows = rows.filter(p => {
      if (ehFinalizada(p.etapa)) return true
      return (p.responsavel||'N/A').toUpperCase().trim() !== 'N/A'
    })
  } else if (filtroColab === 'N/A') {
    rows = rows.filter(p => {
      const a = (p.responsavel||'N/A').toUpperCase().trim()
      const e = (p.estagiario||'N/A').toUpperCase().trim()
      return a === 'N/A' || e === 'N/A'
    })
  } else {
    // Clicar num nome mostra tudo daquela pessoa, seja como analista ou estagiário
    rows = rows.filter(p =>
      (p.responsavel||'N/A').toUpperCase().trim() === filtroColab ||
      (p.estagiario||'N/A').toUpperCase().trim() === filtroColab
    )
  }
  rows = aplicarFiltrosData(rows)
  // Arquivadas: somem de tudo, menos quando o botão "Arquivadas" está ativo
  rows = rows.filter(p => mostrarArquivadas ? !!p.arquivada : !p.arquivada)
  if (mostrarArquivadas) return rows
  // Esconde finalizadas (Concedido/Recusado/Excluído) do fluxo do dia a dia,
  // exceto quando: o botão "Mostrar finalizadas" está ativo, o usuário
  // filtrou explicitamente por uma etapa finalizada, OU há uma busca textual ativa
  // (a busca deve encontrar qualquer proposta, inclusive finalizadas).
  const filtrouEtapaFinalizada = filtroEtapa && ehFinalizada(filtroEtapa)
  const temBusca = filtroSearch.trim().length > 0
  if (!mostrarFinalizadas && !filtrouEtapaFinalizada && !temBusca) {
    rows = rows.filter(p => ehAtiva(p.etapa))
  }
  return rows
}

// Retorna as linhas exatamente como exibidas na tabela (com busca e ordenação)
function getLinhasVisiveis() {
  let rows = getLinhasFiltradas()
  if (filtroSearch.trim()) {
    const q = filtroSearch.toLowerCase()
    rows = rows.filter(p =>
      String(p.codigo||'').toLowerCase().includes(q) ||
      (p.nome||'').toLowerCase().includes(q) ||
      (p.etapa||'').toLowerCase().includes(q)
    )
  }
  rows.sort((a,b) => {
    let va = a[sortCol] ?? '', vb = b[sortCol] ?? ''
    if (typeof va === 'number' && typeof vb === 'number') return (va-vb)*sortDir
    return String(va).localeCompare(String(vb), 'pt-BR') * sortDir
  })
  return rows
}

function contarFiltrosAtivos() {
  let n = 0
  if (filtroDataIni) n++
  if (filtroDataFim) n++
  if (filtroValorMin !== '') n++
  if (filtroValorMax !== '') n++
  if (filtroEtapa) n++
  if (filtroLinhaCredito) n++
  return n
}

// Gera as opções de etapa a partir das propostas carregadas, ordenadas pelo funil
// Preenche o select de etapas depois que as propostas foram carregadas.
// Necessario porque o HTML do filtro e montado no INIT, antes dos dados chegarem.
function popularSelectEtapas() {
  const sel = document.getElementById('fa-etapa')
  if (!sel) return
  const atual = filtroEtapa
  sel.innerHTML = '<option value="">Todas as etapas</option>' + opcoesEtapas()
  sel.value = atual || ''
}

function opcoesEtapas() {
  const etapasSet = new Set()
  todasPropostas.forEach(p => { const e = (p.etapa||'').trim(); if (e) etapasSet.add(e) })
  const etapas = [...etapasSet].sort((a,b) => {
    const pa = posicaoFunil(a), pb = posicaoFunil(b)
    if (pa === -1 && pb === -1) return a.localeCompare(b,'pt-BR')
    if (pa === -1) return 1
    if (pb === -1) return -1
    return pa - pb
  })
  return etapas.map(e => `<option value="${e}" ${filtroEtapa===e?'selected':''}>${e}</option>`).join('')
}

function atualizarBadgeFiltros() {
  const badge = document.getElementById('fa-badge')

  if (!badge) return
  const n = contarFiltrosAtivos()
  badge.innerHTML = n > 0 ? `<span class="filtro-badge-count">${n}</span>` : ''

  filtroDataFim = document.getElementById('fa-data-fim')?.value || ''

function limparFiltrosAvancados() {
  pagAtual = 1
  filtroDataIni = ''; filtroDataFim = ''; filtroValorMin = ''; filtroValorMax = ''
  filtroEtapa = ''; filtroLinhaCredito = ''
  const ids = ['fa-data-ini','fa-data-fim','fa-valor-min','fa-valor-max','fa-etapa','fa-linha']
  ids.forEach(id => { const e = document.getElementById(id); if (e) e.value = '' })
  renderTabelaPropostas()
  renderStatsPropostas()
  atualizarBadgeFiltros()
  showToast('Filtros limpos')
}

function valorNum(p) {
  let n
  if (typeof p.valor === 'number') n = p.valor
  else n = parseFloat(String(p.valor||'0').replace(/[^0-9.,]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'))
  if (isNaN(n)) return 0
  return corrigirValor(n)
}

function renderStatsPropostas() {
  const el = document.getElementById('dashboard-propostas')
  if (!el) return

  const linhas = getLinhasFiltradas()

  // Contexto do filtro
  let ctx = []
  if (filtroColab === 'NOVAS') ctx.push('Propostas novas')
  else if (filtroColab === 'N/A') ctx.push('Sem responsável')
  else if (filtroColab !== 'TODOS') ctx.push(filtroColab)
  else ctx.push('Todos os responsáveis')
  if (filtroEtapa) ctx.push(filtroEtapa)
  if (filtroLinhaCredito) ctx.push(filtroLinhaCredito)
  const contexto = ctx.join(' · ')

  // Métricas
  const total = linhas.length
  const ativas = linhas.filter(p => ehAtiva(p.etapa))
  const totalAtivas = ativas.length
  const valorAtivo = ativas.reduce((s,p) => s + valorNum(p), 0)
  const valorTotal = linhas.reduce((s,p) => s + valorNum(p), 0)
  const concedidas = linhas.filter(p => (p.etapa||'').toLowerCase().trim() === 'concedido').length
  // Recusado + Excluído somados (100% juntos)
  const naoConcedidas = linhas.filter(p => {
    const e = (p.etapa||'').toLowerCase().trim()
    return e === 'recusado' || e === 'excluído' || e === 'excluido'
  }).length

  // Propostas ativas paradas há 15+ dias
  const paradasList = ativas.filter(p => {
    const d = diasParados(p.na_etapa_desde)
    return d !== null && d >= DIAS_LIMITE_PARADA
  })
  const paradas = paradasList.length

  // Média de dias parados (só ativas com data válida)
  const diasArr = ativas.map(p => diasParados(p.na_etapa_desde)).filter(d => d !== null)
  const mediaDias = diasArr.length ? Math.round(diasArr.reduce((s,d) => s+d, 0) / diasArr.length) : 0

  // Cards — sempre acompanham os filtros ativos
  const ehGeral = (filtroColab === 'TODOS' || filtroColab === 'N/A' || filtroColab === 'NOVAS')
  const rotuloTotal = ehGeral ? 'Total de Propostas' : `Propostas de ${filtroColab}`

  let cards = `
    <div class="dash-card accent-azul"><div class="dash-label">${rotuloTotal}</div><div class="dash-value">${total}</div></div>
    <div class="dash-card accent-verde"><div class="dash-label">Ativas</div><div class="dash-value">${totalAtivas}</div><div class="dash-sub">em tratativa</div></div>
    <div class="dash-card accent-dourado"><div class="dash-label">Valor em Tratativa<span class="ajuda ajuda-baixo" data-ajuda="Soma do valor apenas das propostas ATIVAS (em andamento). Não inclui Concedido, Recusado nem Excluído.">?</span></div><div class="dash-value" style="font-size:19px">${formatValor(valorAtivo)}</div><div class="dash-sub">só propostas ativas</div></div>
    <div class="dash-card accent-roxo"><div class="dash-label">Valor Total<span class="ajuda ajuda-baixo" data-ajuda="Soma do valor de TODAS as propostas do filtro atual, incluindo as já finalizadas.">?</span></div><div class="dash-value" style="font-size:19px">${formatValor(valorTotal)}</div><div class="dash-sub">todas as propostas</div></div>
    <div class="dash-card accent-parada"><div class="dash-label">⚠️ Paradas 15+ dias<span class="ajuda ajuda-baixo" data-ajuda="Propostas ativas que estão há 15 dias ou mais na mesma etapa sem avançar. Só conta propostas em andamento.">?</span></div><div class="dash-value" style="color:${paradas>0?'#dc2626':'#16a34a'}">${paradas}</div><div class="dash-sub">propostas ativas</div></div>
    <div class="dash-card accent-cinza"><div class="dash-label">Média de Dias Parados<span class="ajuda ajuda-baixo ajuda-esq" data-ajuda="Média de quantos dias as propostas ativas estão paradas na etapa atual. Ajuda a medir a velocidade de andamento.">?</span></div><div class="dash-value">${mediaDias}<span style="font-size:14px;font-weight:600;color:#9ca3af"> dias</span></div><div class="dash-sub">média das ativas na etapa</div></div>`

  el.innerHTML = `
    <div class="dash-header">
      <div class="dash-title">📈 Painel de Indicadores</div>
      <div class="dash-context">${contexto}</div>
    </div>
    <div class="dash-grid">${cards}</div>`
}

function setFiltroColab(c) {
  filtroColab = c
  pagAtual = 1
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'))
  const btn = document.getElementById(`filtro-${c}`)
  if (btn) {
    btn.classList.add('active')
    if (c === 'NOVAS') btn.style.borderColor = '#003366'
  }
  renderTabelaPropostas()
  renderStatsPropostas()
  atualizarBadgeFiltros()
}

function setSearch(v) { filtroSearch = v; pagAtual = 1; renderTabelaPropostas(); atualizarBadgeFiltros() }

function setSort(col) {
  if (sortCol === col) sortDir *= -1
  else { sortCol = col; sortDir = 1 }
  pagAtual = 1
  renderTabelaPropostas()
}

function renderTabelaPropostas() {
  const todasRows = getLinhasVisiveis()

  // A largura de cada coluna e fixa (table-layout: fixed) para a tabela caber
  // inteira na tela: o texto quebra em mais linhas em vez de rolar para o lado.
  const cols = [
    {key:'responsavel', label:'Analista', w:'10%'},
    {key:'estagiario', label:'Estagiário', w:'10%'},
    {key:'codigo', label:'Código', w:'5.5%'},
    {key:'nome', label:'Cliente / Razão Social', w:'15%'},
    {key:'linha_credito', label:'Linha', w:'6%'},
    {key:'municipio', label:'Município', w:'7.5%'},
    {key:'etapa', label:'Etapa', w:'10%'},
    {key:'valor', label:'Valor', align:'right', w:'8.5%'},
    {key:'na_etapa_desde', label:'Na Etapa Desde', w:'9%', ajuda:'Data em que a proposta entrou na etapa atual. O icone de alerta e os dias entre parenteses mostram ha quanto tempo esta parada.'},
    {key:'observacao', label:'Observação', w:'18.5%'},
  ]
  const colgroup = `<colgroup><col style="width:34px">${cols.map(c => `<col style="width:${c.w}">`).join('')}</colgroup>`

  if (!todasRows.length) {
    document.getElementById('tabela-propostas').innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Nenhuma proposta encontrada.</p></div>`
    renderBarraLote()
    return
  }

  // ── Paginação ──
  const totalPags = Math.max(1, Math.ceil(todasRows.length / pagTamanho))
  if (pagAtual > totalPags) pagAtual = totalPags
  if (pagAtual < 1) pagAtual = 1
  const ini = (pagAtual - 1) * pagTamanho
  const rows = todasRows.slice(ini, ini + pagTamanho)

  // Códigos visíveis na página (para o "selecionar todos")
  const codigosPagina = rows.map(p => String(p.codigo))
  const todosSelecionados = codigosPagina.length > 0 && codigosPagina.every(c => selecionadas.has(c))

  const th = `<th class="check-col"><input type="checkbox" class="row-check" ${todosSelecionados?'checked':''} onclick="toggleSelecionarPagina(this.checked)" title="Selecionar todos desta página"/></th>` +
    cols.map(c => {
      const isSorted = sortCol === c.key
      const icon = isSorted ? (sortDir===1?'↑':'↓') : '↕'
      const tip = c.ajuda ? `<span class="ajuda ajuda-baixo ajuda-esq" data-ajuda="${c.ajuda}" onclick="event.stopPropagation()">?</span>` : ''
      return `<th class="${isSorted?'sorted':''}" onclick="setSort('${c.key}')" style="${c.align?'text-align:'+c.align:''}">
        ${c.label}${tip} <span class="sort-icon">${icon}</span>
      </th>`
    }).join('')

  const trs = rows.map(p => {
    const resp = p.responsavel || 'N/A'
    const bg = getCorColab(resp)
    const fg = getTextColor(bg)
    const iniciais = getIniciais(resp)

    // Célula do Analista (papel 'analista')
    const respCell = resp === 'N/A'
      ? `<td><div class="resp-cell"><span class="resp-tarja" style="background:#cbd5e1"></span>
           <div class="dd-trigger" onclick="abrirDropdown(this, '${p.codigo}', 'N/A', 'analista')">👤 Atribuir</div>
         </div></td>`
      : `<td><div class="resp-cell">
           <span class="resp-tarja" style="background:${bg}"></span>
           <span class="resp-avatar" style="background:${bg};color:${fg}">${iniciais}</span>
           <span class="resp-nome">${resp}</span>
           <button class="btn-trocar-v2" title="Trocar analista" onclick="abrirDropdown(this, '${p.codigo}', '${resp}', 'analista')">✎</button>
         </div></td>`

    // Célula do Estagiário (papel 'estagiario')
    const est = p.estagiario || 'N/A'
    const bgE = getCorColab(est)
    const fgE = getTextColor(bgE)
    const estCell = est === 'N/A'
      ? `<td><div class="resp-cell">
           <div class="dd-trigger" onclick="abrirDropdown(this, '${p.codigo}', 'N/A', 'estagiario')">👤 Atribuir</div>
         </div></td>`
      : `<td><div class="resp-cell">
           <span class="resp-avatar" style="background:${bgE};color:${fgE}">${getIniciais(est)}</span>
           <span class="resp-nome">${est}</span>
           <button class="btn-trocar-v2" title="Trocar estagiário" onclick="abrirDropdown(this, '${p.codigo}', '${est}', 'estagiario')">✎</button>
         </div></td>`

    // A observacao aparece escrita na propria celula e abre o editor no clique.
    const obs = (p.observacao || '').trim()
    const obsCell = `<td><div class="obs-cell${obs ? '' : ' vazia'}" title="Clique para editar"
        onclick="abrirModal('${p.codigo}')">
        <span class="obs-edit">✏</span>
        <div class="obs-txt">${obs ? `<span class="obs-data">${dataObs(p.observacao_em)}</span>${esc(obs)}` : '+ adicionar observação'}</div>
      </div></td>`

    const etapasFin = ['concedido','excluído','excluido','recusado']
    const ehAtiva = !etapasFin.includes((p.etapa||'').toLowerCase().trim())
    const dias = diasParados(p.na_etapa_desde)
    const paradaClass = (ehAtiva && dias !== null && dias >= DIAS_LIMITE_PARADA) ? ' class="linha-parada"' : ''

    const estaSel = selecionadas.has(String(p.codigo))
    const classes = [paradaClass.replace(' class="','').replace('"',''), estaSel ? 'selecionada' : ''].filter(Boolean).join(' ')
    const trClass = classes ? ` class="${classes}"` : ''

    return `<tr${trClass} data-codigo="${p.codigo}">
      <td class="check-col"><input type="checkbox" class="row-check" ${estaSel?'checked':''} onclick="toggleSelecionada('${p.codigo}', this.checked)"/></td>
      ${respCell}
      ${estCell}
      <td class="td-cnpj" style="font-weight:700">${esc(p.codigo)||'—'}</td>
      <td class="td-nome" title="${esc(p.nome||'')}">${p.nome
        ? `${esc(p.nome)} <span onclick="editarNome('${p.codigo}')" title="Editar nome" style="cursor:pointer;color:#94a3b8;font-size:11px">✎</span>`
        : `<span onclick="editarNome('${p.codigo}')" title="Digitar o nome do cliente" style="cursor:pointer;color:#94a3b8;font-style:italic;font-size:12px;font-weight:400">+ adicionar nome</span>`}</td>
      <td>${linhaBadge(p.linha_credito)}</td>
      <td class="td-mun">${esc(p.municipio) || '—'}</td>
      <td class="td-etapa" onclick="abrirModalEtapaProposta('${p.codigo}')" title="Clique para mudar a etapa" style="cursor:pointer">${etapaBadge(p.etapa)}</td>
      <td class="td-valor">${formatValor(p.valor)}</td>
      ${celulaData(p)}
      ${obsCell}
    </tr>`
  }).join('')

  const fim = Math.min(ini + pagTamanho, todasRows.length)

  document.getElementById('tabela-propostas').innerHTML = `
    <div id="lote-bar-container"></div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">${todasRows.length} proposta${todasRows.length!==1?'s':''} encontrada${todasRows.length!==1?'s':''}</div>
    <div class="table-wrap">
      <table>
        ${colgroup}
        <thead><tr>${th}</tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>
    ${renderPaginacao(todasRows.length, ini+1, fim, totalPags)}`

  renderBarraLote()
}

// ── Paginação ──
function renderPaginacao(total, de, ate, totalPags) {
  if (total <= pagTamanho && pagTamanho !== 0) {
    return `<div class="pag-wrap">
      <div class="pag-info">Mostrando <b>${total}</b> proposta${total!==1?'s':''}</div>
      <div class="pag-ctrl">
        <span style="font-size:12px;color:var(--text-muted);margin-right:6px">Por página:</span>
        <select class="pag-size" onchange="setPagTamanho(this.value)">
          ${[25,50,100,200].map(n => `<option value="${n}" ${pagTamanho===n?'selected':''}>${n}</option>`).join('')}
          <option value="0" ${pagTamanho===0?'selected':''}>Todas</option>
        </select>
      </div>
    </div>`
  }

  // Botões de página (com reticências quando há muitas)
  let botoes = ''
  const janela = 2
  const pages = []
  for (let i = 1; i <= totalPags; i++) {
    if (i === 1 || i === totalPags || (i >= pagAtual-janela && i <= pagAtual+janela)) pages.push(i)
    else if (pages[pages.length-1] !== '...') pages.push('...')
  }
  botoes = pages.map(p =>
    p === '...' ? `<span class="pag-dots">···</span>`
    : `<button class="pag-btn ${p===pagAtual?'ativo':''}" onclick="irPagina(${p})">${p}</button>`
  ).join('')

  return `<div class="pag-wrap">
    <div class="pag-info">Mostrando <b>${de}–${ate}</b> de <b>${total}</b> propostas</div>
    <div class="pag-ctrl">
      <button class="pag-btn" onclick="irPagina(${pagAtual-1})" ${pagAtual<=1?'disabled':''}>‹</button>
      ${botoes}
      <button class="pag-btn" onclick="irPagina(${pagAtual+1})" ${pagAtual>=totalPags?'disabled':''}>›</button>
      <select class="pag-size" style="margin-left:8px" onchange="setPagTamanho(this.value)">
        ${[25,50,100,200].map(n => `<option value="${n}" ${pagTamanho===n?'selected':''}>${n}/pág</option>`).join('')}
        <option value="0" ${pagTamanho===0?'selected':''}>Todas</option>
      </select>
    </div>
  </div>`
}

function irPagina(n) {
  pagAtual = n
  renderTabelaPropostas()
  document.querySelector('.table-wrap')?.scrollTo({ top: 0, behavior: 'smooth' })
}

function setPagTamanho(v) {
  const n = Number(v)
  pagTamanho = n === 0 ? 999999 : n
  pagAtual = 1
  renderTabelaPropostas()
}

let dropdownAberto = null
let modalRespCodigo = null
let modalRespLote = false
let modalRespPapel = 'analista'   // 'analista' ou 'estagiario'

function fecharDropdown() {
  if (dropdownAberto) {
    dropdownAberto.remove()
    dropdownAberto = null
    document.removeEventListener('click', handlerFecharFora, true)
  }
}

function handlerFecharFora(e) {
  if (dropdownAberto && !dropdownAberto.contains(e.target) && !e.target.closest('.dd-trigger') && !e.target.closest('.btn-trocar-v2')) {
    fecharDropdown()
  }
}

// ── Modal de seleção de responsável (substitui o dropdown inline) ──
function abrirDropdown(anchor, codigo, respAtual, papel = 'analista') {
  modalRespCodigo = String(codigo)
  modalRespLote = false
  modalRespPapel = papel
  const p = todasPropostas.find(x => String(x.codigo) === String(codigo))
  const nomePapel = papel === 'estagiario' ? 'estagiário' : 'analista'
  document.getElementById('mr-titulo').textContent = (respAtual === 'N/A' ? 'Atribuir ' : 'Trocar ') + nomePapel
  document.getElementById('mr-sub').innerHTML = `Proposta <b>${codigo}</b>${p && p.etapa ? ' · ' + p.etapa : ''}`
  montarGridResp(respAtual)
  abrirModalRespUI()
}

// Abre o modal e prepara a UI (busca limpa + foco)
function abrirModalRespUI() {
  const busca = document.getElementById('mr-busca')
  if (busca) busca.value = ''
  document.getElementById('mr-vazio').style.display = 'none'
  document.getElementById('modal-resp').style.display = 'flex'
  setTimeout(() => busca && busca.focus(), 60)
}

// Filtra os colaboradores conforme a digitação
function filtrarModalResp(termo) {
  const q = (termo || '').toLowerCase().trim()
  const opts = document.querySelectorAll('#mr-grid .mr-opt')
  let visiveis = 0
  opts.forEach(o => {
    const nome = (o.dataset.nome || '').toLowerCase()
    const bate = !q || nome.includes(q)
    o.classList.toggle('hidden', !bate)
    if (bate) visiveis++
  })
  document.getElementById('mr-vazio').style.display = visiveis === 0 ? '' : 'none'
}

function abrirModalRespLote() {
  fecharDropdown()
  const n = selecionadas.size
  if (!n) return
  modalRespCodigo = null
  modalRespLote = true
  document.getElementById('mr-titulo').textContent = 'Reatribuir em lote'
  document.getElementById('mr-sub').innerHTML = `<b>${n}</b> proposta${n!==1?'s':''} selecionada${n!==1?'s':''}`
  montarGridResp(null)
  abrirModalRespUI()
}

function montarGridResp(respAtual) {
  // Mostra apenas as pessoas do papel selecionado
  const lista = modalRespPapel === 'estagiario' ? ESTAGIARIOS : ANALISTAS
  // Opção de desatribuir, quando já existe alguém
  const opcaoRemover = (respAtual && respAtual !== 'N/A')
    ? `<div class="mr-opt mr-opt-remover" data-nome="N/A" onclick="escolherResp('N/A')">
         <span class="mr-opt-avatar" style="background:#f1f5f9;color:#94a3b8">✕</span>
         <span class="mr-opt-nome" style="color:#64748b">Remover ${modalRespPapel === 'estagiario' ? 'estagiário' : 'analista'}</span>
       </div>`
    : ''
  document.getElementById('mr-grid').innerHTML = opcaoRemover + lista.map(c => {
    const cor = getCorColab(c)
    const fgC = getTextColor(cor)
    const ehAtual = c === respAtual
    return `<div class="mr-opt ${ehAtual?'atual':''}" data-nome="${c}" onclick="escolherResp('${c.replace(/'/g,"\\'")}')">
      <span class="mr-opt-avatar" style="background:${cor};color:${fgC}">${getIniciais(c)}</span>
      <span class="mr-opt-nome">${c}</span>
      ${ehAtual ? '<span class="mr-opt-check">✓</span>' : ''}
    </div>`
  }).join('')
}

function fecharModalResp(e) {
  if (e && e.target !== document.getElementById('modal-resp')) return
  document.getElementById('modal-resp').style.display = 'none'
  modalRespCodigo = null
  modalRespLote = false
}

async function escolherResp(novo) {
  const emLote = modalRespLote
  const codigo = modalRespCodigo
  const papel = modalRespPapel
  document.getElementById('modal-resp').style.display = 'none'
  modalRespCodigo = null
  modalRespLote = false

  if (emLote) { await reatribuirLote(novo); return }
  const atual = todasPropostas.find(p => String(p.codigo) === String(codigo))
  if (papel === 'estagiario') {
    if (atual && atual.estagiario === novo) return
    await atribuirEstagiario(codigo, novo)
  } else {
    if (atual && atual.responsavel === novo) return
    await atribuirResponsavel(codigo, novo, null)
  }
}

// Salva o estagiário da proposta
async function atribuirEstagiario(codigo, nome) {
  if (!nome) return   // 'N/A' é permitido: significa desatribuir
  try {
    await sb(`fgf_propostas?codigo=eq.${encodeURIComponent(codigo)}`, {
      method: 'PATCH', prefer: 'return=minimal',
      body: { estagiario: nome }
    })
    // Atualiza também a referência, para persistir entre processamentos
    const refs = await sb('fgf_referencia?select=id,dados&order=criado_em.desc&limit=1')
    if (refs && refs[0]) {
      const dados = refs[0].dados || []
      const i = dados.findIndex(r => String(r.codigo).trim() === String(codigo).trim())
      if (i !== -1) dados[i].estagiario = nome
      else dados.push({ codigo: String(codigo).trim(), responsavel_final: 'N/A', estagiario: nome, observacao: '' })
      await sb(`fgf_referencia?id=eq.${refs[0].id}`, { method: 'PATCH', prefer: 'return=minimal', body: { dados } })
    }
    const idx = todasPropostas.findIndex(p => String(p.codigo) === String(codigo))
    if (idx !== -1) todasPropostas[idx].estagiario = nome
    showToast(nome === 'N/A' ? '✓ Estagiário removido' : `✓ ${nome} definido como estagiário`)
    renderTabelaPropostas()
    renderStatsPropostas()
    setTimeout(() => {
      const tr = document.querySelector(`tr[data-codigo="${codigo}"]`)
      if (tr) tr.classList.add('linha-salva')
    }, 50)
  } catch(e) {
    showToast('Erro ao definir estagiário: ' + e.message, 'error')
  }
}

async function atribuirResponsavel(codigo, resp, selectEl) {
  if (!resp) return
  try {
    // 1. Salva na tabela propostas
    await sb(`fgf_propostas?codigo=eq.${encodeURIComponent(codigo)}`, {
      method: 'PATCH',
      prefer: 'return=minimal',
      body: { responsavel: resp, responsavel_final: resp }
    })

    // 2. Atualiza a fgf_referencia mais recente para persistir entre reprocessamentos
    const refs = await sb('fgf_referencia?select=id,dados&order=criado_em.desc&limit=1')
    if (refs && refs[0]) {
      const refId = refs[0].id
      const dados = refs[0].dados || []
      const idx2 = dados.findIndex(r => String(r.codigo).trim() === String(codigo).trim())
      if (idx2 !== -1) {
        dados[idx2].responsavel_final = resp
      } else {
        dados.push({ codigo: String(codigo).trim(), responsavel_final: resp, observacao: '' })
      }
      await sb(`fgf_referencia?id=eq.${refId}`, {
        method: 'PATCH',
        prefer: 'return=minimal',
        body: { dados }
      })
    }

    const idx = todasPropostas.findIndex(p => p.codigo === codigo)
    if (idx !== -1) { todasPropostas[idx].responsavel = resp; todasPropostas[idx].responsavel_final = resp }
    showToast(`✓ ${resp} atribuído e salvo`)
    renderTabelaPropostas()
    renderStatsPropostas()
    // Destaca a linha recém-salva
    setTimeout(() => {
      const tr = document.querySelector(`tr[data-codigo="${codigo}"]`)
      if (tr) tr.classList.add('linha-salva')
    }, 50)
  } catch(e) {
    showToast('Erro ao atribuir: ' + e.message, 'error')
  }
}

// ============================================================
// MODAL OBSERVAÇÃO

// Recebe so o codigo e busca o resto na lista carregada. Antes o texto ia
// dentro do onclick, o que quebrava com aspas — e razao social tem aspas.
function abrirModal(codigo) {
  const p = todasPropostas.find(x => String(x.codigo) === String(codigo)) || {}
  modalCodigo = codigo
  document.getElementById('modal-title').textContent = 'Observação'
  document.getElementById('modal-info').textContent = p.nome
    ? `${p.nome} — Código ${codigo}`
    : `Código da Operação: ${codigo}`
  document.getElementById('modal-obs-antiga').textContent = p.observacoes_anteriores || '—'
  document.getElementById('modal-textarea').value = p.observacao || ''
  document.getElementById('modal-obs').style.display = 'flex'
}

function fecharModal(e) {
  if (e && e.target !== document.getElementById('modal-obs')) return
  document.getElementById('modal-obs').style.display = 'none'
  modalCodigo = null
}

// Edição manual do nome / razão social (para quem veio sem nome)
async function editarNome(codigo) {
  const p = todasPropostas.find(x => String(x.codigo) === String(codigo))
  const atual = p ? (p.nome || '') : ''
  const novo = prompt(`Nome / razão social da proposta ${codigo}:`, atual)
  if (novo === null) return
  const valor = limparNomeCliente(novo).toUpperCase()
  if (valor === atual) return
  try {
    await sb(`fgf_propostas?codigo=eq.${encodeURIComponent(codigo)}`, { method: 'PATCH', prefer: 'return=minimal', body: { nome: valor } })
    if (p) p.nome = valor
    renderTabelaPropostas()
    showToast(valor ? '✓ Nome salvo' : '✓ Nome apagado')
  } catch(e) { showToast('Erro ao salvar: ' + e.message, 'error') }
}

async function salvarObservacao() {
  if (!modalCodigo) return
  const obs = document.getElementById('modal-textarea').value.trim()
  const btn = document.getElementById('btn-salvar-obs')
  const atual = todasPropostas.find(p => String(p.codigo) === String(modalCodigo)) || {}
  const anterior = (atual.observacao || '').trim()
  if (obs === anterior) { fecharModal(); return }
  btn.disabled = true; btn.textContent = 'Salvando...'
  try {
    // Agora que a observacao e fixa, "anteriores" guarda a versao que foi
    // substituida — e o unico momento em que ela muda.
    // Data/hora do comentário: aparece na frente do texto ("29/10 - ...")
    const agora = new Date().toISOString()
    const corpo = { observacao: obs, observacao_em: obs ? agora : null }
    if (anterior) corpo.observacoes_anteriores = anterior
    await sb(`fgf_propostas?codigo=eq.${encodeURIComponent(modalCodigo)}`, {
      method: 'PATCH',
      prefer: 'return=minimal',
      body: corpo
    })
    const idx = todasPropostas.findIndex(p => String(p.codigo) === String(modalCodigo))
    if (idx !== -1) {
      if (anterior) todasPropostas[idx].observacoes_anteriores = anterior
      todasPropostas[idx].observacao = obs
      todasPropostas[idx].observacao_em = obs ? agora : null
    }
    document.getElementById('modal-obs').style.display = 'none'
    modalCodigo = null
    showToast('Observação salva!')
    renderTabelaPropostas()
  } catch(e) {
    showToast('Erro ao salvar: ' + e.message, 'error')
  } finally {
    btn.disabled = false; btn.textContent = 'Salvar'
  }
}

function toggleSelecionada(codigo, marcado) {
  const c = String(codigo)
  if (marcado) selecionadas.add(c)
  else selecionadas.delete(c)
  const tr = document.querySelector(`tr[data-codigo="${c}"]`)
  if (tr) tr.classList.toggle('selecionada', marcado)
  renderBarraLote()
}

function toggleSelecionarPagina(marcado) {
  const todasRows = getLinhasVisiveis()
  const ini = (pagAtual - 1) * pagTamanho
  const rows = todasRows.slice(ini, ini + pagTamanho)
  rows.forEach(p => {
    const c = String(p.codigo)
    if (marcado) selecionadas.add(c)
    else selecionadas.delete(c)
  })
  renderTabelaPropostas()
}

function limparSelecao() {
  selecionadas.clear()
  renderTabelaPropostas()
}

function selecionarTodosFiltrados() {
  getLinhasVisiveis().forEach(p => selecionadas.add(String(p.codigo)))
  renderTabelaPropostas()
  showToast(`${selecionadas.size} propostas selecionadas`)
}

// ══ Ações em lote e por proposta (iguais às do microcrédito) ══
const inCodigos = lote => `codigo=in.(${lote.map(c => `"${c}"`).join(',')})`

async function patchLote(codigos, corpo, aplicarLocal) {
  let ok = 0, erros = 0
  for (let i = 0; i < codigos.length; i += 200) {
    const lote = codigos.slice(i, i + 200)
    try {
      await sb(`fgf_propostas?${inCodigos(lote)}`, { method: 'PATCH', prefer: 'return=minimal', body: corpo })
      const set = new Set(lote)
      todasPropostas.forEach(p => { if (set.has(String(p.codigo))) aplicarLocal(p) })
      ok += lote.length
    } catch(e) { erros += lote.length; console.error(e) }
  }
  return { ok, erros }
}

// Tira analista E estagiário das selecionadas
async function enviarLoteNA() {

  if (!codigos.length) return
  if (!confirm(`Tirar analista e estagiário de ${codigos.length} proposta${codigos.length!==1?'s':''}? Elas vão para N/A.`)) return

    p => { p.responsavel = 'N/A'; p.responsavel_final = 'N/A'; p.estagiario = 'N/A' })
  selecionadas.clear()
  showToast(`✓ ${r.ok} enviada${r.ok!==1?'s':''} para N/A${r.erros?` · ${r.erros} com erro`:''}`, r.erros && !r.ok ? 'error' : undefined)

}

  if (lbl) lbl.textContent = mostrarArquivadas ? '↩ Voltar às ativas' : '📦 Arquivadas'

  pagAtual = 1

let arquivadasCarregadas = false
async function carregarArquivadas() {
  if (arquivadasCarregadas) return
  try {
    const achadas = await sbAll('fgf_propostas?select=*&arquivada=eq.true')
    arquivadasCarregadas = true
    const jaTem = new Set(todasPropostas.map(p => String(p.codigo)))
    const novas = (achadas || []).filter(p => !jaTem.has(String(p.codigo)))
    if (novas.length) todasPropostas = todasPropostas.concat(novas)
    if (mostrarArquivadas) { renderTabelaPropostas(); renderStatsPropostas() }
  } catch(e) { showToast('Para usar o arquivo, rode o SQL fgf_arquivada.sql no Supabase', 'error') }
}

async function arquivarLote(arquivar) {
  const codigos = [...selecionadas]
  if (!codigos.length) return
  const txt = arquivar
    ? `Arquivar ${codigos.length} proposta${codigos.length!==1?'s':''}?\n\nElas somem da lista e do painel, mas NÃO são apagadas. Dá para ver e desarquivar no botão "📦 Arquivadas".`
    : `Desarquivar ${codigos.length} proposta${codigos.length!==1?'s':''}?`
  if (!confirm(txt)) return
  const r = await patchLote(codigos, { arquivada: arquivar }, p => { p.arquivada = arquivar })
  selecionadas.clear()
  if (r.erros && !r.ok) showToast('Erro ao arquivar. Rode o SQL fgf_arquivada.sql no Supabase.', 'error')
  else showToast(`✓ ${r.ok} proposta${r.ok!==1?'s':''} ${arquivar ? 'arquivada' : 'desarquivada'}${r.ok!==1?'s':''}${r.erros?` · ${r.erros} com erro`:''}`)
  renderTabelaPropostas(); renderStatsPropostas()
}

// Exclui do sistema, guardando cópia em backup_excluidas
async function excluirLote() {
  const codigos = [...selecionadas]
  if (!codigos.length) return
  if (!confirm(`Excluir ${codigos.length} proposta${codigos.length!==1?'s':''} do sistema?\n\nUma cópia fica guardada no banco (backup_excluidas), então dá para restaurar depois.`)) return
  let ok = 0, erros = 0
  for (let i = 0; i < codigos.length; i += 200) {
    const lote = codigos.slice(i, i + 200)
    try {
      const copias = todasPropostas.filter(p => lote.includes(String(p.codigo)))
      if (copias.length) {
        try { await sb('backup_excluidas', { method: 'POST', prefer: 'return=minimal',
          body: copias.map(c => ({ codigo: 'FGF-' + c.codigo, dados: c })) }) } catch(e) {}
      }
      await sb(`fgf_propostas?${inCodigos(lote)}`, { method: 'DELETE', prefer: 'return=minimal' })
      const set = new Set(lote)
      todasPropostas = todasPropostas.filter(p => !set.has(String(p.codigo)))
      ok += lote.length
    } catch(e) { erros += lote.length; console.error(e) }
  }
  selecionadas.clear()
  showToast(`✓ ${ok} proposta${ok!==1?'s':''} excluída${ok!==1?'s':''}${erros?` · ${erros} com erro`:''}`)
  renderTabelaPropostas(); renderStatsPropostas()
}

async function reatribuirLote(novoResp) {
  const codigos = [...selecionadas]
  if (!codigos.length) return

  if (!confirm(`Reatribuir ${codigos.length} proposta${codigos.length!==1?'s':''} para ${novoResp}?`)) return

  const cont = document.getElementById('lote-bar-container')
  if (cont) cont.innerHTML = `<div class="lote-bar ativo"><span class="lote-count"><span class="spinner"></span> Reatribuindo 0/${codigos.length}...</span></div>`

  let ok = 0, erros = 0
  try {
    // 1. Atualiza cada proposta no banco
    for (const codigo of codigos) {
      try {
        await sb(`fgf_propostas?codigo=eq.${encodeURIComponent(codigo)}`, {
          method: 'PATCH', prefer: 'return=minimal',
          body: { responsavel: novoResp, responsavel_final: novoResp }
        })
        const idx = todasPropostas.findIndex(p => String(p.codigo) === String(codigo))
        if (idx !== -1) { todasPropostas[idx].responsavel = novoResp; todasPropostas[idx].responsavel_final = novoResp }
        ok++
        if (cont && ok % 3 === 0) cont.innerHTML = `<div class="lote-bar ativo"><span class="lote-count"><span class="spinner"></span> Reatribuindo ${ok}/${codigos.length}...</span></div>`
      } catch(e) { erros++ }
    }

    // 2. Atualiza a referência (uma única vez, com todos os códigos)
    const refs = await sb('fgf_referencia?select=id,dados&order=criado_em.desc&limit=1')
    if (refs && refs[0]) {
      const refId = refs[0].id
      const dados = refs[0].dados || []
      codigos.forEach(codigo => {
        const i = dados.findIndex(r => String(r.codigo).trim() === String(codigo).trim())
        if (i !== -1) dados[i].responsavel_final = novoResp
        else dados.push({ codigo: String(codigo).trim(), responsavel_final: novoResp, observacao: '' })
      })
      await sb(`fgf_referencia?id=eq.${refId}`, {
        method: 'PATCH', prefer: 'return=minimal', body: { dados }
      })
    }

    selecionadas.clear()
    renderTabelaPropostas()
    renderStatsPropostas()
    showToast(erros ? `✓ ${ok} reatribuídas, ${erros} com erro` : `✓ ${ok} propostas reatribuídas para ${novoResp}`, erros ? 'error' : 'success')
  } catch(e) {
    showToast('Erro ao reatribuir: ' + e.message, 'error')
    renderTabelaPropostas()
  }
}

function nomeContextoFiltro() {
  if (filtroColab === 'TODOS') return 'Todos os responsaveis'
  if (filtroColab === 'NOVAS') return 'Propostas novas'
  if (filtroColab === 'N/A') return 'Sem responsavel'
  return filtroColab
}

function descricaoFiltros() {
  const partes = []
  partes.push(`Filtro: ${nomeContextoFiltro()}`)
  if (filtroSearch.trim()) partes.push(`Busca: "${filtroSearch}"`)
  if (filtroDataIni || filtroDataFim) {
    partes.push(`Periodo: ${filtroDataIni ? formatData(filtroDataIni) : 'inicio'} ate ${filtroDataFim ? formatData(filtroDataFim) : 'hoje'}`)
  }
  if (filtroValorMin !== '' || filtroValorMax !== '') {
    partes.push(`Valor: ${filtroValorMin !== '' ? formatValor(Number(filtroValorMin)) : 'R$ 0,00'} ate ${filtroValorMax !== '' ? formatValor(Number(filtroValorMax)) : 'sem limite'}`)
  }
  return partes.join('  |  ')
}

function exportarExcel() {
  const rows = getLinhasVisiveis()
  if (!rows.length) { showToast('Nenhuma proposta para exportar', 'error'); return }

  const dados = rows.map(p => {
    const dias = diasParados(p.na_etapa_desde)
    const ativa = ehAtiva(p.etapa)
    return {
      'Analista': p.responsavel || 'N/A',
      'Estagiário': p.estagiario || 'N/A',
      'Código da Operação': p.codigo || '',
      'Cliente / Razão Social': p.nome || '',
      'Linha de Crédito': p.linha_credito || '',
      'Município': p.municipio || '',
      'Etapa': p.etapa || '',
      'Valor (R$)': valorNum(p),
      'Data de Cadastro': formatData(p.data_cadastro),
      'Na Etapa Desde': formatData(p.na_etapa_desde),
      'Dias na Etapa': dias !== null ? dias : '',
      'Situação': ativa ? (dias !== null && dias >= DIAS_LIMITE_PARADA ? 'PARADA' : 'Em tratativa') : 'Finalizada',
      'Observação': (p.observacao_em && p.observacao ? dataObs(p.observacao_em) : '') + (p.observacao || ''),
    }
  })

  const ws = XLSX.utils.json_to_sheet(dados)
  ws['!cols'] = [ {wch:14},{wch:14},{wch:18},{wch:38},{wch:16},{wch:18},{wch:26},{wch:14},{wch:15},{wch:15},{wch:13},{wch:14},{wch:40} ]

  const wb = XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb, ws, 'Propostas')

  // Aba de resumo
  const totalValor = rows.reduce((s,p) => s + valorNum(p), 0)
  const ativas = rows.filter(p => ehAtiva(p.etapa))
  const paradas = ativas.filter(p => { const d = diasParados(p.na_etapa_desde); return d !== null && d >= DIAS_LIMITE_PARADA })
  const resumo = [
    { Indicador: 'Data da exportação', Valor: new Date().toLocaleString('pt-BR') },
    { Indicador: 'Filtro aplicado', Valor: nomeContextoFiltro() },
    { Indicador: 'Total de propostas', Valor: rows.length },
    { Indicador: 'Em tratativa (ativas)', Valor: ativas.length },
    { Indicador: 'Paradas 15+ dias', Valor: paradas.length },
    { Indicador: 'Valor total', Valor: totalValor },
    { Indicador: 'Valor em tratativa', Valor: ativas.reduce((s,p) => s + valorNum(p), 0) },
  ]
  const wsR = XLSX.utils.json_to_sheet(resumo)
  wsR['!cols'] = [ {wch:26},{wch:26} ]
  XLSX.utils.book_append_sheet(wb, wsR, 'Resumo')

  const hoje = new Date().toISOString().split('T')[0]
  const nome = `GiroFacil_${nomeContextoFiltro().replace(/[^a-zA-Z0-9]/g,'_')}_${hoje}.xlsx`
  XLSX.writeFile(wb, nome)
  showToast(`✓ ${rows.length} propostas exportadas`)
}

  </style></head><body>
  <button class="no-print" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  <div class="hdr">
    <div><h1>FOMENTO PARANÁ — Fomento Giro Fácil</h1><div class="sub">Relatório de Propostas</div></div>

  const win = window.open('', '_blank')
  if (!win) { showToast('Permita pop-ups para exportar o PDF', 'error'); return }

  win.document.close()
  showToast(`✓ Relatório gerado — use "Imprimir / Salvar PDF"`)
}
