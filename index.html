let dadosPainel = { propostas: [], historico: [] }

async function carregarPainel() {
  const el = document.getElementById('view-painel')
  el.innerHTML = `<div class="card"><div class="empty"><div class="empty-icon">⏳</div><p>Carregando painel...</p></div></div>`
  try {
    const [props, hist] = await Promise.all([
      sbAll('fgf_propostas?select=*'),
      sb('fgf_historico?select=*&order=criado_em.desc&limit=12')
    ])
    // Mesma janela da aba Propostas: ativas + finalizadas desde 2025
    dadosPainel.propostas = normalizarPropostas(filtrarPorJanela(props || []))
    dadosPainel.historico = hist || []
    renderPainel()
  } catch(e) {
    el.innerHTML = `<div class="card"><div class="alert alert-danger">❌ Erro ao carregar painel: ${e.message}</div></div>`
  }
}

function renderPainel() {
  const el = document.getElementById('view-painel')
  if (!dadosPainel.propostas.length) {
    el.innerHTML = `<div class="card"><div class="painel-empty">📭 Nenhuma proposta processada ainda.<br>Processe as planilhas na aba "⚙ Processar" para ver os indicadores.</div></div>`
    return
  }

  const d = calcularDadosPainel()
  const props = d.props
  const totalP = props.length || 1

  // ══ BARRA DE FILTROS DO PAINEL ══
  // Opções = só o que existe na base
  const basePainel = dadosPainel.propostas.filter(p => !p.arquivada)
  const ordemEtapa = (a,b) => { const pa=posicaoFunil(a), pb=posicaoFunil(b); if(pa===-1&&pb===-1) return a.localeCompare(b,'pt-BR'); if(pa===-1) return 1; if(pb===-1) return -1; return pa-pb }
  painelOpcoesAtuais = {
    colab: [...new Set(basePainel.flatMap(pessoasDaProposta))].sort((a,b) => a === 'N/A' ? 1 : b === 'N/A' ? -1 : a.localeCompare(b,'pt-BR')),
    etapa: [...new Set(basePainel.map(chaveEtapa))].sort(ordemEtapa),
    linha: [...new Set(basePainel.map(chaveLinha))].sort((a,b) => a.localeCompare(b,'pt-BR')),
  }

  const filtrosPainel = `
    <div class="painel-filtros">
      ${msFiltro('colab', '👤', 'Analistas e estagiários', painelOpcoesAtuais.colab)}
      ${msFiltro('etapa', '📊', 'Etapas', painelOpcoesAtuais.etapa)}
      ${msFiltro('linha', '🏷️', 'Linhas', painelOpcoesAtuais.linha)}
      ${temFiltroPainel() ? `<button class="btn btn-secondary btn-sm" onclick="limparFiltrosPainel()">✕ Limpar</button>` : ''}
    </div>
    <div class="painel-filtros painel-filtros-data">
      <div class="pf-data">
        <span class="pf-data-lbl">📅 Data de Cadastro</span>
        <input type="date" class="fa-input" value="${painelCadIni}" max="9999-12-31" onchange="if(dataPronta(this.value)){painelCadIni=this.value; renderPainel()}"/>
        <span>até</span>
        <input type="date" class="fa-input" value="${painelCadFim}" max="9999-12-31" onchange="if(dataPronta(this.value)){painelCadFim=this.value; renderPainel()}"/>
      </div>
      <div class="pf-data">
        <span class="pf-data-lbl">⏱ Na Etapa Desde</span>
        <input type="date" class="fa-input" value="${painelEtapaIni}" max="9999-12-31" onchange="if(dataPronta(this.value)){painelEtapaIni=this.value; renderPainel()}"/>
        <span>até</span>
        <input type="date" class="fa-input" value="${painelEtapaFim}" max="9999-12-31" onchange="if(dataPronta(this.value)){painelEtapaFim=this.value; renderPainel()}"/>
      </div>
    </div>`

  // ══ CARDS DE RESUMO ══
  // Percentual pelo VALOR (R$): concedido ÷ (concedido + recusado + excluído).
  // O percentual por quantidade fica no desfecho do funil.
  const valorDecidido = d.valorConcedido + d.valorNaoConcedido
  const pctConc = valorDecidido ? ((d.valorConcedido/valorDecidido)*100).toFixed(1) : '0.0'
  const pctNaoConc = valorDecidido ? ((d.valorNaoConcedido/valorDecidido)*100).toFixed(1) : '0.0'
  const resumo = `
    <div class="dash-grid">
      <div class="dash-card accent-azul"><div class="dash-label">Total de Propostas</div><div class="dash-value">${props.length}</div></div>
      <div class="dash-card accent-verde"><div class="dash-label">Em Tratativa</div><div class="dash-value">${d.ativas.length}</div><div class="dash-sub">${formatValor(d.valorAtivo)}</div></div>
      <div class="dash-card accent-roxo"><div class="dash-label">Concedidas<span class="ajuda ajuda-baixo" data-ajuda="O percentual e pelo VALOR em R$: valor concedido dividido pelo valor concedido mais recusado mais excluido. O percentual por quantidade aparece no desfecho do funil.">?</span></div><div class="dash-value">${d.concedidas.length}</div><div class="dash-sub">${formatValor(d.valorConcedido)} · ${pctConc}% do valor</div></div>
      <div class="dash-card accent-vermelho"><div class="dash-label">Recusadas + Excluídas<span class="ajuda ajuda-baixo" data-ajuda="Recusado e Excluido contam juntos. O percentual e pelo VALOR em R$, sobre o valor das propostas ja decididas.">?</span></div><div class="dash-value">${d.naoConcedidas.length}</div><div class="dash-sub">${formatValor(d.valorNaoConcedido)} · ${pctNaoConc}% do valor</div></div>
      <div class="dash-card accent-parada"><div class="dash-label">⚠️ Paradas 15+ dias<span class="ajuda ajuda-baixo" data-ajuda="Propostas ativas há 15 dias ou mais na mesma etapa. O detalhamento aparece na seção 'Propostas Mais Paradas' abaixo.">?</span></div><div class="dash-value" style="color:${d.paradas.length>0?'#dc2626':'#16a34a'}">${d.paradas.length}</div><div class="dash-sub">precisam de atenção</div></div>
      <div class="dash-card accent-cinza"><div class="dash-label">Média de Dias Parados<span class="ajuda ajuda-baixo ajuda-esq" data-ajuda="Média de dias que as propostas ativas estão paradas na etapa. Quanto menor, mais ágil o andamento.">?</span></div><div class="dash-value">${d.mediaDias}<span style="font-size:14px;font-weight:600;color:#9ca3af"> dias</span></div><div class="dash-sub">média das ativas</div></div>
    </div>`

  // ══ SEÇÃO "ETAPAS" — duas colunas (inteiras à esquerda, extensões à direita) ══
  const corEtapaFunil = (etapa) => {
    const e = (etapa||'').toLowerCase()
    if (e === 'concedido') return '#16a34a'
    if (e === 'excluído' || e === 'excluido') return '#dc2626'
    if (e === 'recusado') return '#d97706'
    return '#3b82f6'
  }

  // Monta uma linha de etapa no estilo FomentoNet (nome à esquerda, barra, % à direita)
  // Seção Etapas: filtros gerais + filtro próprio de Data de Cadastro
  const propsEtapas = props
  const totalEtapas = propsEtapas.length || 1
  const etapaMapSec = {}
  propsEtapas.forEach(p => {
    const bruto = (p.etapa||'—').trim() || '—'
    const e = posicaoFunil(bruto) !== -1 ? normalizarNomeEtapa(bruto) : bruto
    if (!etapaMapSec[e]) etapaMapSec[e] = { count: 0, valor: 0 }
    etapaMapSec[e].count++
    etapaMapSec[e].valor += valorNum(p)
  })
  const maxEtapaCol = Math.max(1, ...ETAPAS_INTEIRAS.concat(ETAPAS_EXTENSOES).map(et => (etapaMapSec[et]||{}).count || 0))
  const etapaLinha = (etapa) => {
    const dd = etapaMapSec[etapa] || { count: 0, valor: 0 }
    const pctTotal = ((dd.count/totalEtapas)*100).toFixed(2)
    const larguraBarra = maxEtapaCol ? Math.round((dd.count/maxEtapaCol)*100) : 0
    const cor = dd.count > 0 ? corEtapaFunil(etapa) : '#e5e7eb'
    // Cor do badge de %: laranja se for uma das maiores, verde caso contrário
    const badgeCor = dd.count === 0 ? '#9ca3af' : (larguraBarra >= 60 ? '#ea580c' : (larguraBarra >= 25 ? '#eab308' : '#16a34a'))
    return `<div class="etapa-linha">
      <div class="etapa-nome">${etapa} ${dd.count > 0
        ? `<button class="etapa-qtd-btn" onclick="verPropostasDaEtapa('${etapa.replace(/'/g,"\\'")}')" title="Ver as propostas desta etapa">${dd.count} 👁</button>`
        : `<span class="etapa-qtd">(0)</span>`}</div>
      <div class="etapa-barra-track">
        <div class="etapa-barra-fill" style="width:${Math.max(larguraBarra,1)}%;background:${cor}"></div>
      </div>
      <div class="etapa-pct" style="background:${badgeCor}">${pctTotal}%</div>
    </div>`
  }

  const etapas = `
    <div class="painel-secao">
      <div class="painel-secao-titulo">📋 Etapas<span class="ajuda ajuda-baixo ajuda-dir" data-ajuda="Todas as etapas oficiais do fluxo. À esquerda as etapas principais (1 a 13), à direita as subetapas de regularização. Mostra quantas propostas há em cada uma e o percentual do total.">?</span></div>
      <div class="painel-secao-sub">Listagem das propostas por etapa — clique no número para ver a lista</div>
      <div class="etapas-colunas">
        <div class="etapas-col">
          <div class="etapas-col-titulo">Etapas principais</div>
          ${ETAPAS_INTEIRAS.map(etapaLinha).join('')}
        </div>
        <div class="etapas-col">
          <div class="etapas-col-titulo">Subetapas / Regularizações</div>
          ${ETAPAS_EXTENSOES.map(etapaLinha).join('')}
        </div>
      </div>
    </div>`

  // ══ SEÇÃO "FUNIL" — cumulativo decrescente, só etapas inteiras (1 a 13) ══
  // Lógica: Fase N = (total de ativas) menos (todas as ativas que estão nas fases 1 até N-1).
  // Ou seja, mostra quantas propostas já passaram por essa fase ou estão à frente dela.
  const ativasTotal = d.ativas.length
  // Conta ativas em cada etapa inteira
  const ativasPorEtapa = {}
  ETAPAS_INTEIRAS.forEach(et => { ativasPorEtapa[et] = 0 })
  d.ativas.forEach(p => {
    const norm = normalizarNomeEtapa(p.etapa)
    if (ativasPorEtapa[norm] !== undefined) { ativasPorEtapa[norm]++; return }
    // Subetapa (ex: 6.1, 12.1) conta na etapa principal correspondente
    const num = parseInt(String(norm).match(/^(\d+)/)?.[1] || '', 10)
    const pai = ETAPAS_INTEIRAS.find(et => parseInt(et, 10) === num)
    if (pai) ativasPorEtapa[pai]++
  })

  let acumulado = 0
  const funilFases = ETAPAS_INTEIRAS.map((etapa, i) => {
    // Quem chegou nessa fase = total de ativas - as que ficaram nas fases anteriores
    const restante = ativasTotal - acumulado
    acumulado += ativasPorEtapa[etapa]  // soma quem parou nesta fase, para descontar na próxima
    return { etapa, valor: restante, ordem: i+1, parou: ativasPorEtapa[etapa] }
  })
  const funilBase = ETAPAS_INTEIRAS.reduce((s, et) => s + ativasPorEtapa[et], 0)
  const decididas = d.concedidas.length + d.naoConcedidas.length
  const pctBifConc = decididas ? ((d.concedidas.length/decididas)*100).toFixed(1) : '0.0'
  const pctBifNao  = decididas ? ((d.naoConcedidas.length/decididas)*100).toFixed(1) : '0.0'
  const maxBif = Math.max(1, d.concedidas.length, d.naoConcedidas.length)
  const maxFunil = Math.max(1, ...funilFases.map(f => f.valor))

  // Gradiente de cores do funil (topo largo/quente -> base estreita/fria)
  const funilCores = ['#DC2626','#EA580C','#D97706','#CA8A04','#65A30D','#16A34A','#059669','#0D9488','#0891B2','#0284C7','#2563EB','#4F46E5','#7C3AED']
  const funil = `
    <div class="painel-secao">
      <div class="painel-secao-titulo">🔻 Funil da Safra 2025–2026<span class="ajuda ajuda-baixo ajuda-dir" data-ajuda="As fases contam só as EM ANDAMENTO: cada fase soma quem está nela mais quem já está nas fases seguintes. Subetapas contam na etapa principal. Concedidas e recusadas/excluídas aparecem no desfecho, como histórico desde 2025.">?</span></div>
      <div class="painel-secao-sub">${funilBase} em andamento no funil · ${decididas} já decididas (histórico desde 2025)</div>
      <div class="funilv-wrap">
        ${funilFases.map((f, i) => {
          // Largura fielmente proporcional ao valor (valores iguais = largura igual;
          // como a lógica é cumulativa decrescente, nunca fica mais largo que a fase de cima).
          const prop = maxFunil ? (f.valor/maxFunil)*100 : 0
          const larg = f.valor > 0 ? Math.max(prop, 6) : 4
          const pctTotal = funilBase ? ((f.valor/funilBase)*100).toFixed(1) : '0.0'
          const cor = funilCores[i] || '#7C3AED'
          const corProx = funilCores[i+1] || cor
          const estreito = larg < 12
          return `<div class="funilv-fase">
            <div class="funilv-info-esq">${f.etapa}${f.parou ? `<span class="funilv-parou" title="${f.parou} nesta fase">${f.parou} aqui</span>` : ''}</div>
            <div class="funilv-barra-area">
              <div class="funilv-trapezio" style="width:${larg}%;--cor:${cor};--cor-prox:${corProx}">
                ${estreito ? '' : `<span class="funilv-valor">${f.valor}</span>`}
              </div>
              ${estreito ? `<span class="funilv-valor-fora" style="color:${cor}">${f.valor}</span>` : ''}
            </div>
            <div class="funilv-info-dir">${pctTotal}%</div>
          </div>`
        }).join('')}
        <div class="funilv-bifurcacao">
          <div class="bif-conector"><span class="bif-linha"></span><span class="bif-rotulo">Desfecho</span><span class="bif-linha"></span></div>
          <div class="bif-lados">
            <div class="bif-lado bif-ok">
              <div class="bif-titulo">✅ Concedidas</div>
              <div class="bif-barra" style="width:${Math.max((d.concedidas.length/maxBif)*100, 8)}%;background:linear-gradient(180deg,#16A34A,#15803D)"></div>
              <div class="bif-num">${d.concedidas.length.toLocaleString('pt-BR')}</div>
              <div class="bif-pct">${pctBifConc}% das decididas</div>
            </div>
            <div class="bif-lado bif-nao">
              <div class="bif-titulo">❌ Recusadas + Excluídas</div>
              <div class="bif-barra" style="width:${Math.max((d.naoConcedidas.length/maxBif)*100, 8)}%;background:linear-gradient(180deg,#DC2626,#991B1B)"></div>
              <div class="bif-num">${d.naoConcedidas.length.toLocaleString('pt-BR')}</div>
              <div class="bif-pct">${pctBifNao}% das decididas</div>
            </div>
          </div>
        </div>
      </div>
    </div>`


  // ══ DISTRIBUIÇÃO POR LINHA DE CRÉDITO ══
  const linhaEntries = Object.entries(d.linhaMap).sort((a,b) => b[1].count - a[1].count)
  const distLinha = linhaEntries.length ? `
    <div class="painel-secao">
      <div class="painel-secao-titulo">🏷️ Distribuição por Linha de Crédito</div>
      <div class="painel-secao-sub">Quantas propostas e o valor de cada linha</div>
      <div class="linha-cards">
        ${linhaEntries.map(([linha, dd]) => {
          const cor = corLinhaCredito(linha === '(sem linha)' ? '' : linha)
          const pct = ((dd.count/totalP)*100).toFixed(1)
          return `<div class="linha-card" style="border-color:${cor}55">
            <div class="linha-card-top" style="background:${cor}12;color:${cor}">${linha}</div>
            <div class="linha-card-num">${dd.count}<span class="linha-card-pct">${pct}%</span></div>
            <div class="linha-card-val">${formatValor(dd.valor)}</div>
          </div>`
        }).join('')}
      </div>
    </div>` : ''

  // ══ CARGA POR RESPONSÁVEL ══
  const cargaOrd = Object.entries(d.cargaMap).filter(([r]) => r !== 'N/A').sort((a,b) => b[1].ativas - a[1].ativas)
  const carga = `
    <div class="painel-secao">
      <div class="painel-secao-titulo">👥 Carga de Trabalho por Responsável<span class="ajuda ajuda-baixo ajuda-dir" data-ajuda="Ordenado pela quantidade de propostas ATIVAS de cada pessoa (não pelo total), para mostrar quem tem mais trabalho em andamento agora.">?</span></div>
      <div class="painel-secao-sub">Ordenado por propostas ativas (em tratativa)</div>
      <div class="carga-grid">
        ${cargaOrd.map(([nome, dd]) => {
          const cor = getCorColab(nome); const fg = getTextColor(cor)
          return `<div class="carga-card" style="--cor-colab:${cor}">
            <span class="carga-avatar" style="background:${cor};color:${fg}">${getIniciais(nome)}</span>
            <div class="carga-info">
              <div class="carga-nome">${nome} <span class="carga-papel carga-papel-${(dd.papel||'').toLowerCase().replace('á','a')}">${dd.papel||''}</span></div>
              <div class="carga-nums"><span><b>${dd.ativas}</b> ativas</span><span style="color:#9ca3af">de ${dd.total} total</span></div>
              <div class="carga-valor">${formatValor(dd.valorAtivo)}</div>
              ${dd.paradas > 0 ? `<span class="carga-alerta">⚠️ ${dd.paradas} parada${dd.paradas>1?'s':''}</span>` : ''}
            </div>
          </div>`
        }).join('')}
      </div>
    </div>`

  // ══ RANKING DE PARADAS — com observação ══
  const rankParadas = d.rankParadas.slice(0, 15)
  const ranking = `
    <div class="painel-secao">
      <div class="painel-secao-titulo">⏱️ Propostas Mais Paradas</div>
      <div class="painel-secao-sub">Top ${rankParadas.length} propostas ativas há mais tempo na mesma etapa (15+ dias)</div>
      ${rankParadas.length === 0
        ? `<div class="painel-empty">✅ Nenhuma proposta parada há mais de ${DIAS_LIMITE_PARADA} dias. Tudo em dia!</div>`
        : `<table class="rank-table">
            <thead><tr><th>#</th><th>Analista</th><th>Estagiário</th><th>Código</th><th>Cliente / Razão Social</th><th>Etapa</th><th>Valor</th><th>Parada há</th><th>Observação</th></tr></thead>
            <tbody>
              ${rankParadas.map((p, i) => {
                const cor = getCorColab(p.responsavel || 'N/A'); const fg = getTextColor(cor)
                const obs = (p.observacao || '').trim()
                const estR = normalizarPessoa(p.estagiario) || 'N/A'
                const corE = getCorColab(estR); const fgE2 = getTextColor(corE)
                return `<tr>
                  <td class="rank-pos">${i+1}</td>
                  <td><span class="resp-avatar" style="background:${cor};color:${fg};width:24px;height:24px;font-size:9px">${getIniciais(p.responsavel||'N/A')}</span> <span style="font-size:12px;font-weight:600">${p.responsavel||'N/A'}</span></td>
                  <td>${estR !== 'N/A' ? `<span class="resp-avatar" style="background:${corE};color:${fgE2};width:24px;height:24px;font-size:9px">${getIniciais(estR)}</span> <span style="font-size:12px;font-weight:600">${estR}</span>` : '<span style="color:#cbd5e1">—</span>'}</td>
                  <td style="font-family:'IBM Plex Mono',monospace;font-weight:700">${esc(p.codigo)}</td>
                  <td style="font-size:11.5px;max-width:200px">${esc(p.nome) || '—'}</td>
                  <td>${etapaBadge(p.etapa)}</td>
                  <td style="font-family:'IBM Plex Mono',monospace;font-size:11.5px">${formatValor(p.valor)}</td>
                  <td class="rank-dias"><span class="rank-dias-badge">${p.dias} dias</span></td>
                  <td style="font-size:11.5px;color:${obs?'#374151':'#cbd5e1'};max-width:220px">${esc(obs) || '—'}</td>
                </tr>`
              }).join('')}
            </tbody>
          </table>`
      }
    </div>`

  // ══ EVOLUÇÃO — propostas novas por dia (5 dias antes do último processamento) ══
  const evolucao = renderEvolucao()

  el.innerHTML = `
    <div class="card">
      <div class="dash-header">
        <div class="dash-title">📊 Painel Gerencial</div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-secondary btn-sm" onclick="exportarPainelExcel()" title="Exportar indicadores para Excel">📊 Excel</button>
          <button class="btn btn-secondary btn-sm" onclick="exportarPainelPDF()" title="Exportar relatório gerencial em PDF">📄 Relatório PDF</button>
          <button class="btn btn-secondary btn-sm" onclick="carregarPainel()">↺ Atualizar</button>
        </div>
      </div>
      ${filtrosPainel}
      ${resumo}
    </div>
    ${etapas}
    ${funil}
    ${distLinha}
    ${carga}
    ${ranking}
    ${evolucao}`
}

// Evolução: conta propostas por data de "Na Etapa Desde" nos 5 dias anteriores ao último processamento
// ══ PROPOSTAS NOVAS POR SEMANA ══
// Semanas de segunda a domingo, pela Data de Cadastro das planilhas.
// 5 semanas completas + a semana atual (parcial), com tendência por
// regressão linear e a previsão para a semana atual.
let evoSemanas = []
function inicioSemana(d) {
  const x = new Date(d); x.setHours(12,0,0,0)
  const dow = (x.getDay() + 6) % 7          // segunda = 0
  x.setDate(x.getDate() - dow)
  return x
}
const isoDia = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`

function renderEvolucao() {
  const props = propostasPainelFiltradas()

  const N = 5
  const segAtual = inicioSemana(new Date())
  const semanas = []
  for (let i = N; i >= 0; i--) {             // N completas + a atual
    const ini = new Date(segAtual); ini.setDate(ini.getDate() - 7*i)
    const fim = new Date(ini); fim.setDate(fim.getDate() + 6)
    semanas.push({
      ini: isoDia(ini), fim: isoDia(fim), atual: i === 0,
      label: `${ini.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} a ${fim.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}`,
      props: [], count: 0, valor: 0
    })
  }
  props.forEach(p => {
    if (!p.data_cadastro) return
    const dt = String(p.data_cadastro).split('T')[0]
    const s = semanas.find(w => dt >= w.ini && dt <= w.fim)
    if (s) { s.props.push(p); s.count++; s.valor += valorNum(p) }
  })
  evoSemanas = semanas

  const completas = semanas.filter(w => !w.atual)
  const atual = semanas[semanas.length - 1]
  // Regressão linear (mínimos quadrados) nas semanas completas: y = a + b·x
  const n = completas.length
  const xs = completas.map((_, i) => i), ys = completas.map(w => w.count)
  const mx = xs.reduce((s,v)=>s+v,0)/n, my = ys.reduce((s,v)=>s+v,0)/n
  const sxx = xs.reduce((s,x)=>s+(x-mx)**2,0)
  const b = sxx ? xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/sxx : 0
  const a = my - b*mx
  const tendencia = i => Math.max(0, a + b*i)
  const previsao = Math.round(tendencia(n))            // semana atual
  const media = Math.round(my)
  const ultima = completas[n-1].count, penultima = completas[n-2] ? completas[n-2].count : 0
  const variacao = ultima - penultima
  const varPct = penultima ? Math.round((variacao/penultima)*100) : null

  // Desenho
  const L = 44, R = 16, T = 26, B = 46, W = 900, H = 280
  const larg = W - L - R, alt = H - T - B
  const maxV = Math.max(1, ...semanas.map(w => w.count), previsao)
  const slot = larg / semanas.length
  const bw = Math.min(90, slot * 0.58)
  const cx = i => L + slot*i + slot/2
  const py = v => T + alt - (v / maxV) * alt
  const marcas = [0, .25, .5, .75, 1].map(f => ({ v: Math.round(maxV*f), y: py(maxV*f) }))
  const tx1 = cx(0), tx2 = cx(n)                       // linha vai até a semana atual
  const corTend = b >= 0 ? '#16a34a' : '#dc2626'

  return `
    <div class="painel-secao">
      <div class="painel-secao-titulo">📈 Propostas Novas por Semana<span class="ajuda ajuda-baixo ajuda-dir" data-ajuda="Propostas cadastradas em cada semana (segunda a domingo), pela Data de Cadastro. Mostra as ultimas 5 semanas completas e a semana atual. A linha tracejada e a tendencia por regressao linear, e o tracejado na semana atual e a previsao. Clique numa barra para ver as propostas da semana.">?</span></div>
      <div class="painel-secao-sub">Últimas ${N} semanas completas + semana atual · clique na barra para ver as propostas</div>
      <div class="evo-resumo">
        <div class="evo-resumo-item"><span class="evo-resumo-num">${ultima}</span><span class="evo-resumo-lbl">semana passada</span></div>
        <div class="evo-resumo-item">
          <span class="evo-resumo-num" style="color:${variacao > 0 ? '#16a34a' : variacao < 0 ? '#dc2626' : '#64748b'}">
            ${variacao > 0 ? '▲' : variacao < 0 ? '▼' : '='} ${Math.abs(variacao)}${varPct !== null ? ` (${varPct > 0 ? '+' : ''}${varPct}%)` : ''}
          </span>
          <span class="evo-resumo-lbl">vs. semana anterior</span>
        </div>
        <div class="evo-resumo-item"><span class="evo-resumo-num">${media}</span><span class="evo-resumo-lbl">média por semana (${N} sem.)</span></div>
        <div class="evo-resumo-item"><span class="evo-resumo-num" style="color:${corTend}">${b >= 0 ? '↗' : '↘'} ${b >= 0 ? '+' : ''}${b.toFixed(1)}</span><span class="evo-resumo-lbl">tendência (por semana)</span></div>
        <div class="evo-resumo-item"><span class="evo-resumo-num">${atual.count} <span style="font-size:14px;color:#94a3b8">/ ${previsao}</span></span><span class="evo-resumo-lbl">semana atual / previsão</span></div>
      </div>
      <div class="grafico-wrap">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" class="grafico-svg">
          ${marcas.map(m => `
            <line x1="${L}" y1="${m.y.toFixed(1)}" x2="${W-R}" y2="${m.y.toFixed(1)}" class="g-grade"/>
            <text x="${L-8}" y="${(m.y+4).toFixed(1)}" class="g-eixo-y">${m.v}</text>`).join('')}
          ${semanas.map((w, i) => {
            const x = cx(i) - bw/2, y = py(w.count), h = T + alt - y
            const cor = w.atual ? '#93C5FD' : '#2563EB'
            return `<g class="g-barra" style="cursor:pointer" onclick="verPropostasDaSemana(${i})">
              <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="5" fill="${cor}"/>
              <text x="${cx(i).toFixed(1)}" y="${(y-7).toFixed(1)}" class="g-valor" style="font-weight:700">${w.count}</text>
              <text x="${cx(i).toFixed(1)}" y="${H-26}" class="g-eixo-x">${w.label}</text>
              <text x="${cx(i).toFixed(1)}" y="${H-12}" class="g-eixo-x" style="font-weight:600">${w.atual ? 'semana atual' : formatValor(w.valor)}</text>
              <title>${w.label}: ${w.count} proposta${w.count!==1?'s':''} · ${formatValor(w.valor)}</title>
            </g>`
          }).join('')}
          ${(() => { const x = cx(n) - bw/2, y = py(previsao), h = T + alt - y
            return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="5" fill="none" stroke="${corTend}" stroke-width="1.5" stroke-dasharray="5 4"><title>Previsão para a semana atual: ${previsao}</title></rect>` })()}
          <line x1="${tx1.toFixed(1)}" y1="${py(tendencia(0)).toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${py(tendencia(n)).toFixed(1)}" stroke="${corTend}" stroke-width="2" stroke-dasharray="7 5"/>
        </svg>
      </div>
      <div style="font-size:11.5px;color:#64748b;margin-top:6px">
        <span style="display:inline-block;width:10px;height:10px;background:#2563EB;border-radius:2px;vertical-align:middle"></span> semana completa ·
        <span style="display:inline-block;width:10px;height:10px;background:#93C5FD;border-radius:2px;vertical-align:middle"></span> semana atual ·
        <span style="color:${corTend}">- - -</span> tendência e previsão (regressão linear)
      </div>
    </div>`
}

function verPropostasDaSemana(i) {
  const w = evoSemanas[i]
  if (!w) return
  const lista = [...w.props].sort((a,b) => String(a.data_cadastro).localeCompare(String(b.data_cadastro)) || String(a.codigo).localeCompare(String(b.codigo)))
  const diaSemana = v => { const d = new Date(String(v).split('T')[0] + 'T12:00:00'); return d.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'}) }
  document.getElementById('modal-etapa-titulo').textContent = `Semana de ${w.label}${w.atual ? ' (atual)' : ''}`
  document.getElementById('modal-etapa-sub').textContent = `${w.count} proposta${w.count!==1?'s':''} cadastrada${w.count!==1?'s':''} · ${formatValor(w.valor)}`
  document.getElementById('modal-etapa-lista').innerHTML = lista.length
    ? `<table class="lista-etapa">
        <thead><tr><th>Dia</th><th>Analista</th><th>Estagiário</th><th>Código</th><th>Cliente</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>${lista.map(p => `<tr>
          <td style="white-space:nowrap">${diaSemana(p.data_cadastro)}</td>
          <td class="le-resp">${p.responsavel || 'N/A'}</td>
          <td class="le-resp">${p.estagiario || 'N/A'}</td>
          <td class="le-cod">${esc(p.codigo)}</td>
          <td class="le-razao">${esc(p.nome) || '—'}</td>
          <td class="le-valor">${formatValor(p.valor)}</td>
        </tr>`).join('')}</tbody>
      </table>`
    : '<div class="painel-empty">Nenhuma proposta cadastrada nesta semana.</div>'
  document.getElementById('modal-etapa').style.display = 'flex'
}

// ── Exportação do Painel Gerencial ──
// Filtros próprios do Painel Gerencial
// Filtros de seleção múltipla: tudo vem marcado; guardamos o que foi DESMARCADO
const painelExclui = { colab: new Set(), etapa: new Set(), linha: new Set() }
let painelDropAberto = ''
// Pessoas da proposta: analista e estagiário (sem ninguém = N/A)
const pessoasDaProposta = p => {
  const ps = [normalizarPessoa(p.responsavel), normalizarPessoa(p.estagiario)].filter(x => x && x !== 'N/A')
  return ps.length ? ps : ['N/A']
}
const chaveEtapa = p => { const b = (p.etapa||'').trim(); return posicaoFunil(b) !== -1 ? normalizarNomeEtapa(b) : (b || '—') }
const chaveLinha = p => normalizarLinhaCredito(p.linha_credito) || '(sem linha)'
let painelOpcoesAtuais = { colab: [], etapa: [], linha: [] }

function msFiltro(id, icone, rotulo, opcoes) {
  const exc = painelExclui[id]
  const marcadas = opcoes.filter(o => !exc.has(o)).length
  const parcial = marcadas < opcoes.length
  const txt = !parcial ? `Todos (${opcoes.length})` : `${marcadas} de ${opcoes.length}`
  return `<div class="ms-wrap" onclick="event.stopPropagation()">
    <button class="ms-btn${parcial ? ' parcial' : ''}" onclick="painelDropAberto = painelDropAberto==='${id}' ? '' : '${id}'; renderPainel()">${icone} ${rotulo}: ${txt} ▾</button>
    ${painelDropAberto === id ? `<div class="ms-painel">
      <div class="ms-acoes">
        <button onclick="painelExclui.${id}.clear(); renderPainel()">Marcar todos</button>
        <button onclick="painelExclui.${id} = new Set(painelOpcoesAtuais.${id}); renderPainel()">Desmarcar todos</button>
      </div>
      ${opcoes.map((o, i) => `<label class="ms-opcao"><input type="checkbox" ${exc.has(o) ? '' : 'checked'}
          onchange="alternarFiltroPainel('${id}', ${i})"> ${esc(o)}</label>`).join('')}
    </div>` : ''}
  </div>`
}
function alternarFiltroPainel(id, i) {
  const v = painelOpcoesAtuais[id][i]
  if (painelExclui[id].has(v)) painelExclui[id].delete(v); else painelExclui[id].add(v)
  renderPainel()
}
document.addEventListener('click', () => { if (painelDropAberto) { painelDropAberto = ''; if (dadosPainel.propostas.length) renderPainel() } })
// Filtros de data do painel (início e fim opcionais)
let painelCadIni = '', painelCadFim = ''      // Data de Cadastro
let painelEtapaIni = '', painelEtapaFim = ''  // Na Etapa Desde
let etapasCadIni = '', etapasCadFim = ''      // filtro próprio da seção Etapas

// Só aplica a data quando o ano estiver completo (senão o campo trava ao digitar)
function dataPronta(v) {
  if (!v) return true
  const ano = parseInt(String(v).split('-')[0], 10)
  return ano >= 2000 && ano <= 2100
}
function filtroDataEtapas(lista) {
  const soData = v => v ? String(v).split('T')[0] : ''
  let r = lista
  if (etapasCadIni) r = r.filter(p => soData(p.data_cadastro) && soData(p.data_cadastro) >= etapasCadIni)
  if (etapasCadFim) r = r.filter(p => soData(p.data_cadastro) && soData(p.data_cadastro) <= etapasCadFim)
  return r
}
function setFiltroEtapas(campo, valor) {
  if (campo === 'ini') etapasCadIni = valor; else etapasCadFim = valor
  renderPainel()
}
function verPropostasDaEtapa(etapa) {
  const props = propostasPainelFiltradas().filter(p => {
    const bruto = (p.etapa||'—').trim() || '—'
    const norm = posicaoFunil(bruto) !== -1 ? normalizarNomeEtapa(bruto) : bruto
    return norm === etapa
  }).sort((a,b) => String(a.codigo).localeCompare(String(b.codigo)))
  document.getElementById('modal-etapa-titulo').textContent = etapa
  document.getElementById('modal-etapa-sub').textContent =
    `${props.length} proposta${props.length !== 1 ? 's' : ''} · ${formatValor(props.reduce((s,p)=>s+valorNum(p),0))}`
  document.getElementById('modal-etapa-lista').innerHTML = props.length
    ? `<table class="lista-etapa">
        <thead><tr><th>Código</th><th>Cliente</th><th>Analista</th><th>Estagiário</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>${props.map(p => `<tr>
          <td class="le-cod">${esc(p.codigo)}</td>
          <td class="le-razao">${esc(p.nome) || '—'}</td>
          <td class="le-resp">${p.responsavel || 'N/A'}</td>
          <td class="le-resp">${p.estagiario || 'N/A'}</td>
          <td class="le-valor">${formatValor(p.valor)}</td>
        </tr>`).join('')}</tbody>
      </table>`
    : '<div class="painel-empty">Nenhuma proposta nesta etapa.</div>'
  document.getElementById('modal-etapa').style.display = 'flex'
}
function fecharModalEtapa(e) {
  if (e && e.target !== document.getElementById('modal-etapa')) return
  document.getElementById('modal-etapa').style.display = 'none'
}

function limparFiltrosPainel() {
  painelExclui.colab.clear(); painelExclui.etapa.clear(); painelExclui.linha.clear()
  painelCadIni = ''; painelCadFim = ''; painelEtapaIni = ''; painelEtapaFim = ''
  etapasCadIni = ''; etapasCadFim = ''
  renderPainel()
}
function temFiltroPainel() {
  return !!(painelExclui.colab.size || painelExclui.etapa.size || painelExclui.linha.size || painelCadIni || painelCadFim || painelEtapaIni || painelEtapaFim)
}

function propostasPainelFiltradas() {
  let props = dadosPainel.propostas.filter(p => !p.arquivada)
  // Pessoa: a proposta fica se pelo menos uma das pessoas dela (analista ou estagiário) está marcada
  if (painelExclui.colab.size) props = props.filter(p => pessoasDaProposta(p).some(x => !painelExclui.colab.has(x)))
  if (painelExclui.etapa.size) props = props.filter(p => !painelExclui.etapa.has(chaveEtapa(p)))
  if (painelExclui.linha.size) props = props.filter(p => !painelExclui.linha.has(chaveLinha(p)))
  const soData = v => v ? String(v).split('T')[0] : ''
  if (painelCadIni)   props = props.filter(p => soData(p.data_cadastro)  && soData(p.data_cadastro)  >= painelCadIni)
  if (painelCadFim)   props = props.filter(p => soData(p.data_cadastro)  && soData(p.data_cadastro)  <= painelCadFim)
  if (painelEtapaIni) props = props.filter(p => soData(p.na_etapa_desde) && soData(p.na_etapa_desde) >= painelEtapaIni)
  if (painelEtapaFim) props = props.filter(p => soData(p.na_etapa_desde) && soData(p.na_etapa_desde) <= painelEtapaFim)
  return props
}

function calcularDadosPainel() {
  const props = propostasPainelFiltradas()
  const ativas = props.filter(p => ehAtiva(p.etapa))
  const paradas = ativas.filter(p => { const d = diasParados(p.na_etapa_desde); return d !== null && d >= DIAS_LIMITE_PARADA })
  const concedidas = props.filter(p => (p.etapa||'').toLowerCase().trim() === 'concedido')
  // Recusado + Excluído somados (100% juntos)
  const naoConcedidas = props.filter(p => {
    const e = (p.etapa||'').toLowerCase().trim()
    return e === 'recusado' || e === 'excluído' || e === 'excluido'
  })

  // Média de dias parados (ativas com data válida)
  const diasArr = ativas.map(p => diasParados(p.na_etapa_desde)).filter(d => d !== null)
  const mediaDias = diasArr.length ? Math.round(diasArr.reduce((s,d) => s+d, 0) / diasArr.length) : 0

  // Distribuição por etapa (com valor)
  const etapaMap = {}
  props.forEach(p => {
    const bruto = (p.etapa||'—').trim() || '—'
    // Normaliza para o nome oficial (ex: "Análise Cadastral" -> "4 - Análise Cadastral")
    const e = posicaoFunil(bruto) !== -1 ? normalizarNomeEtapa(bruto) : bruto
    if (!etapaMap[e]) etapaMap[e] = { count: 0, valor: 0 }
    etapaMap[e].count++
    etapaMap[e].valor += valorNum(p)
  })

  // Carga por responsável
  // Carga por pessoa: a MESMA proposta conta para o analista E para o estagiário.
  // Os totais gerais do painel são calculados à parte, sobre `props`, então
  // nenhum valor é somado em dobro nos indicadores.
  const cargaMap = {}
  const somaCarga = (nome, papel, p) => {
    const k = normalizarPessoa(nome)
    if (!k || k === 'N/A') return
    if (!cargaMap[k]) cargaMap[k] = { papel, total: 0, ativas: 0, paradas: 0, valorAtivo: 0, valorTotal: 0, concedidas: 0 }
    // Se a pessoa atua nos dois papéis, marca como "Ambos"
    if (cargaMap[k].papel !== papel) cargaMap[k].papel = 'Ambos'
    cargaMap[k].total++
    cargaMap[k].valorTotal += valorNum(p)
    if ((p.etapa||'').toLowerCase().trim() === 'concedido') cargaMap[k].concedidas++
    if (ehAtiva(p.etapa)) {
      cargaMap[k].ativas++
      cargaMap[k].valorAtivo += valorNum(p)
      const d = diasParados(p.na_etapa_desde)
      if (d !== null && d >= DIAS_LIMITE_PARADA) cargaMap[k].paradas++
    }
  }
  props.forEach(p => {
    somaCarga(p.responsavel, 'Analista', p)
    somaCarga(p.estagiario, 'Estagiário', p)
  })

  const rankParadas = ativas
    .map(p => ({ ...p, dias: diasParados(p.na_etapa_desde) }))
    .filter(p => p.dias !== null && p.dias >= DIAS_LIMITE_PARADA)
    .sort((a,b) => b.dias - a.dias)

  // Distribuição por linha de crédito
  const linhaMap = {}
  props.forEach(p => {
    const l = normalizarLinhaCredito(p.linha_credito) || '(sem linha)'
    if (!linhaMap[l]) linhaMap[l] = { count: 0, valor: 0 }
    linhaMap[l].count++
    linhaMap[l].valor += valorNum(p)
  })

  return {
    props, ativas, paradas, concedidas, naoConcedidas, etapaMap, cargaMap, rankParadas, linhaMap, mediaDias,
    valorTotal: props.reduce((s,p) => s + valorNum(p), 0),
    valorAtivo: ativas.reduce((s,p) => s + valorNum(p), 0),
    valorConcedido: concedidas.reduce((s,p) => s + valorNum(p), 0),
    valorNaoConcedido: naoConcedidas.reduce((s,p) => s + valorNum(p), 0),
    semResp: props.filter(p => !p.responsavel || p.responsavel === 'N/A').length,
  }
}

function exportarPainelExcel() {
  if (!dadosPainel.propostas.length) { showToast('Nenhum dado para exportar', 'error'); return }
  const d = calcularDadosPainel()
  const wb = XLSX.utils.book_new()

  // Aba 1 — Resumo Executivo
  const resumo = [
    { Indicador: 'Data do relatório', Valor: new Date().toLocaleString('pt-BR') },
    { Indicador: 'Total de propostas', Valor: d.props.length },
    { Indicador: 'Em tratativa (ativas)', Valor: d.ativas.length },
    { Indicador: 'Concedidas', Valor: d.concedidas.length },
    { Indicador: 'Recusadas + Excluídas', Valor: d.naoConcedidas.length },
    { Indicador: 'Paradas 15+ dias', Valor: d.paradas.length },
    { Indicador: 'Média de dias parados', Valor: d.mediaDias },
    { Indicador: 'Valor total', Valor: d.valorTotal },
    { Indicador: 'Valor em tratativa', Valor: d.valorAtivo },
    { Indicador: 'Valor concedido', Valor: d.valorConcedido },
    { Indicador: 'Valor recusado + excluído', Valor: d.valorNaoConcedido },
  ]
  const wsR = XLSX.utils.json_to_sheet(resumo)
  wsR['!cols'] = [{wch:26},{wch:24}]
  XLSX.utils.book_append_sheet(wb, wsR, 'Resumo Executivo')

  // Aba 2 — Funil por Etapa
  const funil = Object.entries(d.etapaMap)
    .sort((a,b) => b[1].count - a[1].count)
    .map(([etapa, v]) => ({
      'Etapa': etapa,
      'Quantidade': v.count,
      '% do Total': ((v.count/d.props.length)*100).toFixed(1) + '%',
      'Valor Acumulado (R$)': v.valor,
    }))
  const wsF = XLSX.utils.json_to_sheet(funil)
  wsF['!cols'] = [{wch:30},{wch:12},{wch:12},{wch:20}]
  XLSX.utils.book_append_sheet(wb, wsF, 'Funil por Etapa')

  // Aba 3 — Carga por Responsável
  const carga = Object.entries(d.cargaMap)
    .filter(([r]) => r !== 'N/A')
    .sort((a,b) => b[1].ativas - a[1].ativas)
    .map(([nome, v]) => ({
      'Responsável': nome,
      'Total de Propostas': v.total,
      'Em Tratativa': v.ativas,
      'Concedidas': v.concedidas,
      'Paradas 15+ dias': v.paradas,
      'Valor em Tratativa (R$)': v.valorAtivo,
      'Valor Total (R$)': v.valorTotal,
    }))
  const wsC = XLSX.utils.json_to_sheet(carga)
  wsC['!cols'] = [{wch:14},{wch:18},{wch:13},{wch:12},{wch:16},{wch:20},{wch:18}]
  XLSX.utils.book_append_sheet(wb, wsC, 'Carga por Responsável')

  // Aba 4 — Propostas Paradas
  if (d.rankParadas.length) {
    const rank = d.rankParadas.map((p,i) => ({
      '#': i+1,
      'Analista': p.responsavel || 'N/A',
      'Estagiário': p.estagiario || 'N/A',
      'Código da Operação': p.codigo,
      'Cliente / Razão Social': p.nome || '',
      'Etapa': p.etapa,
      'Valor (R$)': valorNum(p),
      'Na Etapa Desde': formatData(p.na_etapa_desde),
      'Dias Parada': p.dias,
      'Observação': p.observacao || '',
    }))
    const wsP = XLSX.utils.json_to_sheet(rank)
    wsP['!cols'] = [{wch:5},{wch:14},{wch:14},{wch:18},{wch:38},{wch:26},{wch:14},{wch:15},{wch:12},{wch:40}]
    XLSX.utils.book_append_sheet(wb, wsP, 'Propostas Paradas')
  }

  // Aba 5 — Histórico
  if (dadosPainel.historico.length) {
    const hist = dadosPainel.historico.map(h => ({
      'Data': new Date(h.criado_em).toLocaleString('pt-BR'),
      'Total de Propostas': h.total_propostas || 0,
      'Arquivos': (h.arquivos_enviados || []).join(', '),
    }))
    const wsH = XLSX.utils.json_to_sheet(hist)
    wsH['!cols'] = [{wch:20},{wch:18},{wch:50}]
    XLSX.utils.book_append_sheet(wb, wsH, 'Histórico')
  }

  const hoje = new Date().toISOString().split('T')[0]
  XLSX.writeFile(wb, `Painel_Gerencial_GiroFacil_${hoje}.xlsx`)
  showToast('✓ Relatório gerencial exportado')
}

async function carregarArquivosEnviados() {
  const el = document.getElementById('lista-arquivos')
  if (!el) return
  try {
    const lista = await sbAll('arquivos_enviados?select=id,criado_em,nome,origem,tamanho&origem=like.FGF*&order=criado_em.desc')
    if (!lista || !lista.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>Nenhum arquivo guardado ainda. A partir de agora, todo arquivo carregado aparece aqui.</p></div>`
      return
    }
    el.innerHTML = `<table class="lista-etapa">
      <thead><tr><th>Enviado em</th><th>Arquivo</th><th>Origem</th><th style="text-align:right">Tamanho</th><th></th></tr></thead>
      <tbody>${lista.map(a => {
        const dt = new Date(a.criado_em)
        const kb = a.tamanho ? (a.tamanho > 1048576 ? (a.tamanho/1048576).toFixed(1) + ' MB' : Math.round(a.tamanho/1024) + ' KB') : '—'
        return `<tr>
          <td>${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td>
          <td class="le-cod" style="font-weight:600">${esc(a.nome)}</td>
          <td class="le-resp">${esc(a.origem || '')}</td>
          <td class="le-valor">${kb}</td>
          <td style="text-align:right"><button class="btn btn-secondary btn-sm" onclick="baixarArquivoEnviado(${a.id})">⬇ Baixar</button></td>
        </tr>`}).join('')}</tbody></table>`
  } catch(e) {
    el.innerHTML = `<div class="alert alert-warning">Para guardar e baixar os arquivos, rode o SQL <b>arquivos_enviados.sql</b> no Supabase.</div>`
  }
}

async function baixarArquivoEnviado(id) {
  try {
    showToast('Preparando o download...')
    const r = await sb(`arquivos_enviados?select=nome,tipo_mime,conteudo&id=eq.${id}`)
    if (!r || !r[0]) { showToast('Arquivo não encontrado', 'error'); return }
    const bin = atob(r[0].conteudo || '')
    const bytes = new Uint8Array(bin.length)
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
    const blob = new Blob([bytes], { type: r[0].tipo_mime || 'application/octet-stream' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url; a.download = r[0].nome || 'arquivo'
    document.body.appendChild(a); a.click(); a.remove()
    setTimeout(() => URL.revokeObjectURL(url), 2000)
  } catch(e) { showToast('Erro ao baixar: ' + e.message, 'error') }
}

async function carregarHistorico() {
  carregarArquivosEnviados()
  try {
    const data = await sb('fgf_historico?select=*&order=criado_em.desc&limit=50')
    const lista = data || []
    if (!lista.length) {
      document.getElementById('lista-historico').innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>Nenhum processamento realizado ainda.</p></div>`
      return
    }
    document.getElementById('lista-historico').innerHTML = lista.map(h => {
      const dt = new Date(h.criado_em)
      const dataFmt = dt.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'})
      const horaFmt = dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})
      const arqs = (h.arquivos_enviados || []).join(', ')
      return `<div class="hist-item">
        <div class="hist-icon">📊</div>
        <div class="hist-info">
          <div class="hist-data">${dataFmt} às ${horaFmt}</div>
          <div class="hist-detalhe">${arqs || 'Arquivos não registrados'}</div>
        </div>
        <span class="hist-badge">${h.total_propostas || 0} propostas</span>
      </div>`
    }).join('')
  } catch(e) {
    document.getElementById('lista-historico').innerHTML = `<div class="alert alert-danger">❌ Erro: ${e.message}</div>`
  }
}
